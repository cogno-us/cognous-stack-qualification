name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Manifest
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-action-manifest
          ref: 46c950bed37fe3812000895430bc0312d29e37ce
          path: upstream/manifest

      - name: Checkout pinned Replay
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: f63ce914504dd06813c4ccd199b0570dbd8dd427
          path: upstream/replay

      - name: Checkout pinned Control Plane
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: 283500652d47a692fb0b99a1172a6d5faffbd9a7
          path: upstream/control-plane

      - name: Checkout pinned Moltbot Safe
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 1d308faf664c504b6e310db3c7a310153ef7b067
          path: upstream/moltbot-safe

      - name: Checkout pinned ODES
        uses: actions/checkout@v4
        with:
          repository: cogno-us/open-decision-evidence-standard
          ref: cba83a1c06f718a8afd76178f36e5cc15896347d
          path: upstream/odes

      # Accepted Alvorada/GAX retained-artifact dependency.
      - name: Checkout accepted GAX IMX reference
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-governed-exchange
          ref: 6bcde026a804c7377f5e39f57ca6dd00b3c3292d
          path: upstream/gax-imx

      - name: Verify pinned revisions
        run: |
          test "$(git -C upstream/manifest rev-parse HEAD)" = "46c950bed37fe3812000895430bc0312d29e37ce"
          test "$(git -C upstream/replay rev-parse HEAD)" = "f63ce914504dd06813c4ccd199b0570dbd8dd427"
          test "$(git -C upstream/control-plane rev-parse HEAD)" = "283500652d47a692fb0b99a1172a6d5faffbd9a7"
          test "$(git -C upstream/moltbot-safe rev-parse HEAD)" = "1d308faf664c504b6e310db3c7a310153ef7b067"
          test "$(git -C upstream/odes rev-parse HEAD)" = "cba83a1c06f718a8afd76178f36e5cc15896347d"
          test "$(git -C upstream/gax-imx rev-parse HEAD)" = "6bcde026a804c7377f5e39f57ca6dd00b3c3292d"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned Replay validator and package with dev extras
        run: |
          pip install -e upstream/replay
          pip install -e upstream/odes
          pip install -e upstream/gax-imx
          pip install -e ".[dev]"

      - name: Package import smoke checks
        run: |
          python -c "import agent_governance_evidence_pack"
          python -c "from agent_governance_evidence_pack.importer import ImportContractError"

      - name: Run full historical suite including pinned GAX
        env:
          UPSTREAM_MANIFEST_EXAMPLE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
          UPSTREAM_REPLAY_SUCCESS_EXAMPLE: upstream/replay/examples/bounded_success_reconstruction_v0_2.json
          UPSTREAM_REPLAY_LOST_ACK_EXAMPLE: upstream/replay/examples/bounded_lost_ack_reconstruction_v0_2.json
          UPSTREAM_CONTROL_PLANE_ROOT: upstream/control-plane
          UPSTREAM_MOLTBOT_SAFE_ROOT: upstream/moltbot-safe
          UPSTREAM_GAX_ROOT: upstream/gax-imx
          AGEP_PINNED_REPLAY_ROOT: upstream/replay
          AGEP_PINNED_CONTROL_PLANE_ROOT: upstream/control-plane
          AGEP_PINNED_MOLTBOT_ROOT: upstream/moltbot-safe
          AGEP_PINNED_MANIFEST_FIXTURE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
        run: pytest --ignore=tests/test_producer_v2.py

      - name: Check examples
        run: agep check-examples

      - name: Import actual pinned producer example
        run: |
          agep import --manifest upstream/manifest/examples/refund_integration_v1_1.manifest.json --reconstruction upstream/replay/examples/bounded_success_reconstruction_v0_2.json --out /tmp/agep.json --render /tmp/agep.md
          agep validate /tmp/agep.json
          agep render /tmp/agep.json --traceable >/tmp/agep-trace.md

      - name: Checkout accepted Replay
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 274543f1cd7171784a923a8e37015017a0d8bc9d
          path: upstream/replay-v2

      - name: Checkout accepted ODES
        uses: actions/checkout@v4
        with:
          repository: cogno-us/open-decision-evidence-standard
          ref: 226adb0e3cde5377ac9db6f7e5857bfa7e65e30a
          path: upstream/odes-v2

      - name: Checkout accepted Control Plane
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: 2ea9528eeb87e14ff10f05de06473122b9df540f
          path: upstream/cp-v2

      - name: Checkout accepted executor
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 177354e959cc78c59c1a776f018cfbfbf28c927b
          path: upstream/executor-v2

      - name: Install accepted generation after historical GAX gate
        run: |
          pip install -e upstream/replay-v2 -e upstream/odes-v2

      - name: Accepted producer qualification and CLI roundtrip
        env:
          AGEP_V2_ODES_ROOT: upstream/odes-v2
          ODES_V2_REPLAY_ROOT: upstream/replay-v2
          ARB_V2_CONTROL_PLANE_ROOT: upstream/cp-v2
          ARB_V2_MOLTBOT_ROOT: upstream/executor-v2
          ARB_PINNED_MANIFEST_FIXTURE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
        run: |
          pytest tests/test_producer_v2.py
          python scripts/qualify_producer_v2.py /tmp/agep-producer-v2
          agep check-examples

      - uses: actions/upload-artifact@v4
        with:
          name: agep-producer-v2-${{ github.sha }}-py${{ matrix.python-version }}
          path: /tmp/agep-producer-v2/*

      # Current Replay-only compatibility path for the accepted Control Plane
      # persistence repair. Existing ODES/GAX pins above remain historical and
      # are not evidence for this repaired-Control-Plane combination.
      - name: Checkout accepted Replay persistence compatibility
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 043830b56595cecddfa65c064afd1c0b95e64792
          path: upstream/replay-store

      - name: Checkout accepted Control Plane persistence repair
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: 248d899634d9db3518e831bc7ab568a48733f825
          path: upstream/cp-v2-store

      - name: Verify persistence compatibility pins
        run: |
          test "$(git -C upstream/replay-store rev-parse HEAD)" = "043830b56595cecddfa65c064afd1c0b95e64792"
          test "$(git -C upstream/cp-v2 rev-parse HEAD)" = "2ea9528eeb87e14ff10f05de06473122b9df540f"
          test "$(git -C upstream/cp-v2-store rev-parse HEAD)" = "248d899634d9db3518e831bc7ab568a48733f825"
          test "$(git -C upstream/executor-v2 rev-parse HEAD)" = "177354e959cc78c59c1a776f018cfbfbf28c927b"

      - name: Install accepted Replay persistence validator
        run: pip install -e upstream/replay-store

      - name: Focused Control Plane store compatibility tests
        env:
          AGEP_ACCEPTED_REPLAY_ROOT: upstream/replay-store
          AGEP_PERSISTENCE_CONTROL_PLANE_ROOT: upstream/cp-v2-store
          AGEP_ACCEPTED_EXECUTOR_ROOT: upstream/executor-v2
          AGEP_MANIFEST_FIXTURE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
        run: pytest -q tests/test_control_plane_store_compatibility.py

      - name: Full suite under accepted Replay persistence validator
        env:
          UPSTREAM_MANIFEST_EXAMPLE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
          UPSTREAM_REPLAY_SUCCESS_EXAMPLE: upstream/replay/examples/bounded_success_reconstruction_v0_2.json
          UPSTREAM_REPLAY_LOST_ACK_EXAMPLE: upstream/replay/examples/bounded_lost_ack_reconstruction_v0_2.json
          UPSTREAM_CONTROL_PLANE_ROOT: upstream/control-plane
          UPSTREAM_MOLTBOT_SAFE_ROOT: upstream/moltbot-safe
          UPSTREAM_GAX_ROOT: upstream/gax-imx
          AGEP_PINNED_REPLAY_ROOT: upstream/replay
          AGEP_PINNED_CONTROL_PLANE_ROOT: upstream/control-plane
          AGEP_PINNED_MOLTBOT_ROOT: upstream/moltbot-safe
          AGEP_PINNED_MANIFEST_FIXTURE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
          AGEP_ACCEPTED_REPLAY_ROOT: upstream/replay-store
          AGEP_PERSISTENCE_CONTROL_PLANE_ROOT: upstream/cp-v2-store
          AGEP_ACCEPTED_EXECUTOR_ROOT: upstream/executor-v2
          AGEP_MANIFEST_FIXTURE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
        run: pytest --ignore=tests/test_producer_v2.py

      - name: Check examples after persistence compatibility
        run: agep check-examples

      - name: CLI import validate render for repaired Control Plane output
        env:
          ARB_V2_CONTROL_PLANE_ROOT: ${{ github.workspace }}/upstream/cp-v2-store
          ARB_V2_MOLTBOT_ROOT: ${{ github.workspace }}/upstream/executor-v2
          ARB_PINNED_MANIFEST_FIXTURE: ${{ github.workspace }}/upstream/manifest/examples/refund_integration_v1_1.manifest.json
        run: |
          python upstream/replay-store/scripts/generate_producer_v2_examples.py --output-dir /tmp/agep-store-replay
          agep import --manifest upstream/manifest/examples/refund_integration_v1_1.manifest.json --reconstruction /tmp/agep-store-replay/producer_v2_success.json --out /tmp/agep-store.json --render /tmp/agep-store.md
          agep validate /tmp/agep-store.json
          agep render /tmp/agep-store.json --traceable >/tmp/agep-store-trace.md
