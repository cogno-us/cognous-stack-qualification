name: cognous-execution-runtime / Python safety boundary
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: python-safety-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Moltbot Safe
      uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: ${{ inputs.source_revision || '309e194c1b0a3de23e11e20133e6eaf88875e48a' }}
        persist-credentials: false
    - name: Checkout pinned Control Plane
      uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-control-plane
        ref: 2ea9528eeb87e14ff10f05de06473122b9df540f
        path: pinned/control-plane
    - name: Checkout pinned Action Manifest
      uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-action-manifest
        ref: 46c950bed37fe3812000895430bc0312d29e37ce
        path: pinned/action-manifest
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-execution-runtime --source-root "." --evidence
        "qualification-evidence/safety-tests.json"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install focused test dependencies
      run: python -m pip install pytest==8.3.5 pydantic==2.11.9
    - name: Verify pinned revisions
      run: 'test "$(git -C pinned/control-plane rev-parse HEAD)" = "2ea9528eeb87e14ff10f05de06473122b9df540f"

        test "$(git -C pinned/action-manifest rev-parse HEAD)" = "46c950bed37fe3812000895430bc0312d29e37ce"

        '
    - name: Run Python safety and pinned integration tests
      env:
        PYTHONPATH: .:pinned/control-plane/src
        MOLTBOT_SAFE_CONTROL_PLANE_ROOT: pinned/control-plane
        MOLTBOT_SAFE_MANIFEST_FIXTURE: pinned/action-manifest/examples/refund_integration_v1_1.manifest.json
      run: pytest -q tests --ignore=tests/test_refusal_capture.py
    - name: Compile optional OpenShell helpers
      run: python -m compileall -q engine examples/openshell
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-execution-runtime-safety-tests-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
