name: cognous-execution-runtime / OpenAPPA actual reply admission
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  actual-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive
        repository: cogno-us/cognous-execution-runtime
        ref: ${{ inputs.source_revision || '309e194c1b0a3de23e11e20133e6eaf88875e48a' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-execution-runtime --source-root "." --evidence
        "qualification-evidence/actual-admission.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: archestra-ai/OpenAPPA
        ref: 10aa0e09e32d8c6704bdb030dc3c66140bf81915
        path: pinned/openappa
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22.x
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Build actual pinned policy probe
      run: 'set -euo pipefail

        test "$(git -C pinned/openappa rev-parse HEAD)" = 10aa0e09e32d8c6704bdb030dc3c66140bf81915

        rustup toolchain install stable --profile minimal

        cat tools/openappa/cognous_trajectory_contract.rs tools/openappa/cognous_reply_admission_main.rs > pinned/openappa/appa-runtime/examples/cognous_reply_admission.rs

        cd pinned/openappa

        cargo +stable build --locked -p appa --no-default-features --example cognous_reply_admission

        '
    - name: Install pinned Node dependencies
      run: 'corepack enable

        corepack prepare pnpm@10.23.0 --activate

        pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true

        '
    - name: Check types and actual dispatcher decisions
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: 'set -euo pipefail

        export COGNOUS_OPENAPPA_REPLY_PROBE="$GITHUB_WORKSPACE/pinned/openappa/target/debug/examples/cognous_reply_admission"

        pnpm exec tsc -p tsconfig.json --noEmit

        pnpm exec vitest run src/auto-reply/reply/reply-admission.test.ts src/auto-reply/reply/reply-routing.test.ts
        src/auto-reply/reply/reply-admission.openappa.test.ts --maxWorkers=1 --reporter=default --reporter=junit
        --outputFile=openappa-reply-admission.xml

        python - <<''PY''

        import xml.etree.ElementTree as ET

        cases = ET.parse(''openappa-reply-admission.xml'').getroot().findall(''.//testcase'')

        assert len(cases) == 60, len(cases)

        assert all(not any(c.find(tag) is not None for tag in (''skipped'', ''failure'', ''error'')) for c in cases)

        PY

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: openappa-reply-admission-results
        path: openappa-reply-admission.xml
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-execution-runtime-actual-admission-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
