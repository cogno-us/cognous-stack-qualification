name: Qualification dashboard build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 jsonschema==4.26.0
      - name: Validate sources, commitments and negative controls
        run: |
          python tools/validate_catalog.py
          python tools/validate_migrations.py
          python -m unittest discover -s tests -v
          python tools/build_dashboard.py --check-markdown
          node --check dashboard/app.js
          git diff --check
      - name: Retain searchable static dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-dashboard-${{ github.sha }}
          path: _site/
          retention-days: 14
          if-no-files-found: error
