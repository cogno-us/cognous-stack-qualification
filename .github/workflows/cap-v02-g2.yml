# CAP v0.1 gate G2 independent qualification (hosted run). Register cogno-us/cognous-open-control-stack#259; contract: issues/259#issuecomment-6589180377 (section 5) + sprint brief.
#
# STATUS OF THIS RESULT: independent qualification TESTS of the Control Plane G2 head (durable restart-safe freshness state ocs-cap-freshness-state/1, state.backend = file-g2).
# Real Control Plane GovernedAgeWorkflow + real Registry verify_f4_selection_v2 (11 layers) + exact Ed25519Verifier (PyNaCl) + the unchanged Registry conformance kit + a REAL persisted
# state file + REAL separate Python processes; SYNTHETIC keys, mechanism only. CLAIM: synthetic restart-safe. OPERATIONAL TRUST IS NOT ESTABLISHED; local integrity detects accidental
# damage only (whole-store replacement by an older valid copy is NOT detected locally: G3). Not an operational-trust, adoption or release claim. G3 is NOT tested here.
# Includes the G1 regression (the unmodified cap_v01 behavioural tests run against the G2 head).
# THE JOB FAILS on any failure, error, skip or xfail, or if fewer tests than the expected count ran (cap_v02/junit_gate.py). No secrets, read-only token, no network use by tests.
# Third-party actions are pinned by full commit SHA (same as cap-v01-g1.yml):
#   actions/checkout       v4.2.2 -> 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python   v5.6.0 -> a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact v4.6.2 -> ea165f8d65b6e75b540449e92b4886f43607fa02
# RE-PINNING: change CP_G2_SHA below (and the control_plane sha in cap_v02/sources.json, or pass CAP_CP_SHA which the harness honours) to qualify a later G2 head.
name: CAP v0.1 G2 freshness state qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cap_v02/**'
      - '.github/workflows/cap-v02-g2.yml'

permissions:
  contents: read

concurrency:
  group: cap-v02-g2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'
  CAP_REQUIRE_FULL_HISTORY: '1'
  EXPECTED_MIN_TESTS: '250'
  CP_G2_SHA: 4f553705c670ecc898245d73ada910589f279eb6

jobs:
  g2-battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the qualification repository at the exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout Control Plane G2 head (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cogno-us/cognous-control-plane
          ref: ${{ env.CP_G2_SHA }}
          fetch-depth: 0
          path: _src/control_plane
          persist-credentials: false

      - name: Checkout Registry at its pin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cogno-us/cognous-ocs-registry
          ref: 7de0ec9f8471c7a2ff630eb4035fa24d60b5e2eb
          path: _src/registry
          persist-credentials: false

      - name: Checkout Replay at its pin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 6651abef2dfc0960b09907ed268db45e809ee814
          path: _src/replay
          persist-credentials: false

      - name: Set up Python (pinned minor)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install hash-locked dependencies (including hash-locked PyNaCl)
        run: |
          python -m pip install --require-hashes -r .github/locks/cryptography-pydantic-pytest-a9a750.txt
          python -m pip install --require-hashes -r .github/locks/jsonschema-pyyaml-c943d3.txt
          python -m pip install --require-hashes -r _src/registry/requirements-ed25519.lock.txt
          python -c "import nacl, pytest, pydantic; print('PyNaCl', nacl.__version__, 'pytest', pytest.__version__, 'pydantic', pydantic.VERSION)"

      - name: Run the G2 battery (pytest -rA, junit, tripwire, SHA-256 manifest)
        env:
          CAP_SRC_DIR: ${{ github.workspace }}/_src
          CAP_EVIDENCE_DIR: ${{ runner.temp }}/cap-v02-g2-evidence
          CAP_CP_SHA: ${{ env.CP_G2_SHA }}
        run: |
          mkdir -p "$CAP_EVIDENCE_DIR"
          cd cap_v02
          python -m pytest -rA --junitxml="$CAP_EVIDENCE_DIR/junit.xml" 2>&1 | tee "$CAP_EVIDENCE_DIR/pytest-rA.txt"

      - name: Junit gate (fails on any failure, error, skip, xfail or fewer tests than expected)
        run: |
          python cap_v02/junit_gate.py "$RUNNER_TEMP/cap-v02-g2-evidence/junit.xml" --min-tests "$EXPECTED_MIN_TESTS"

      - name: Print the SHA-256 manifest of the changed Control Plane files
        if: always()
        run: cat "$RUNNER_TEMP/cap-v02-g2-evidence/cp-changed-files.sha256" || true

      - name: Upload artifacts (pytest -rA output, junit, SHA-256 manifest)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cap-v02-g2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cap-v02-g2-evidence
          retention-days: 90
          if-no-files-found: error
