name: cognous-execution-runtime / OpenAPPA local host resume
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  local-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: ${{ inputs.source_revision || '309e194c1b0a3de23e11e20133e6eaf88875e48a' }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: archestra-ai/OpenAPPA
        ref: 10aa0e09e32d8c6704bdb030dc3c66140bf81915
        path: pinned/openappa
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-execution-runtime --source-root "." --evidence
        "qualification-evidence/local-resume.json"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Compile existing-only resume probe against pinned upstream
      shell: bash
      run: 'set -euo pipefail

        test "$(git -C pinned/openappa rev-parse HEAD)" = 10aa0e09e32d8c6704bdb030dc3c66140bf81915

        rustup toolchain install stable --profile minimal

        cat tools/openappa/cognous_trajectory_contract.rs tools/openappa/cognous_local_resume_main.rs > pinned/openappa/appa-runtime/examples/cognous_local_resume.rs

        cd pinned/openappa

        cargo +stable build --locked -p appa --no-default-features --example cognous_local_resume

        '
    - name: Exercise kernel peer identity and persisted resume
      env:
        PYTHONPATH: .
        COGNOUS_OPENAPPA_RESUME_PROBE: pinned/openappa/target/debug/examples/cognous_local_resume
      run: 'python -m pip install pytest==8.3.5

        python -m pytest -q tools/openappa/test_local_resume.py --junitxml=local-resume.xml

        python - <<''PY''

        import xml.etree.ElementTree as ET

        cases = ET.parse(''local-resume.xml'').getroot().findall(''.//testcase'')

        assert len(cases) == 25, len(cases)

        assert all(not any(c.find(tag) is not None for tag in (''skipped'', ''failure'', ''error'')) for c in cases)

        PY

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openappa-local-resume-results
        path: local-resume.xml
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-execution-runtime-local-resume-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
