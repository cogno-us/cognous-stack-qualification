name: cognous-open-control-stack / Optional execution profiles
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: optional-execution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: Linux / ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        profile:
        - atomic-authority-effect
        - refund-intent
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPTIONAL_EXECUTION_PROFILE: ${{ matrix.profile }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-open-control-stack
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/profile.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - run: python -m pip install --require-hashes -r .github/locks/pydantic-pytest-2d86c5.txt
    - name: Run selected synthetic profile
      run: python tools/optional_execution_profile.py --profile "$OPTIONAL_EXECUTION_PROFILE" --results-dir "results/$OPTIONAL_EXECUTION_PROFILE"
    - name: Verify selected path and database isolation
      run: timeout 120s python -m pytest -q tests/test_optional_execution_profiles.py tests/test_optional_evidence_contract.py
        --junitxml="results/$OPTIONAL_EXECUTION_PROFILE/tests.xml"
    - name: Derive retained evidence consistency
      run: python tools/verify_optional_evidence.py "results/$OPTIONAL_EXECUTION_PROFILE" > "results/$OPTIONAL_EXECUTION_PROFILE/verification.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optional-${{ matrix.profile }}
        path: results/
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-profile-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
