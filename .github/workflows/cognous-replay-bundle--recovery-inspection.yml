name: cognous-replay-bundle / Synthetic recovery inspection
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: replay
        repository: cogno-us/cognous-replay-bundle
        ref: ${{ inputs.source_revision || '83fbaf2a0f6f071aca1ea0af859eb8fc6385c26a' }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: 8e7d634cf0a22b6f3c1fc6d93afe92c7414fa243
        path: runtime
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-replay-bundle --source-root "replay" --evidence
        ".qualification-evidence/inspect.json"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify producer revision
      run: test "$(git -C runtime rev-parse HEAD)" = "8e7d634cf0a22b6f3c1fc6d93afe92c7414fa243"
    - name: Install Replay and test dependencies
      working-directory: replay
      run: python -m pip install -e '.[dev]'
    - name: Validate Runtime-generated recovery inspection
      working-directory: replay
      env:
        COGNOUS_RUNTIME_SOURCE: ${{ github.workspace }}/runtime
      run: python -m pytest -q tests/recovery_inspection_checks.py
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-replay-bundle-inspect-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: .qualification-evidence/
        if-no-files-found: error
