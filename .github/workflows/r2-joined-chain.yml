# R2 joined-chain qualification (hosted run). Register cogno-us/cognous-open-control-stack#259, parent #254.
#
# PRIVATE PREVIEW QUALIFICATION TUPLE (preview-only, NOT canonical; component-lock.json untouched).
# STATUS OF THIS RESULT: developer/qualification evidence of CLAIM A only (a Registry selection signature admitted by an operator-supplied verifier,
# Control Plane -> Registry F4 -> retained bounded record -> Replay F4 re-admission). Claim B (Control Plane decision authenticated) is NOT made.
# Synthetic only; SINGLE SYNTHETIC TENANT (no shared multi-tenant evidence resolver; no tenant-isolation assurance). Synthetic Ed25519 keys, mechanism only.
# OPERATIONAL TRUST NOT ESTABLISHED / PRODUCTION ADOPTION NOT AUTHORIZED. Not Q7, not a release claim.
# Scope: runs r2_chain/run_chain.py against the sources pinned in r2_chain/sources.json (fetched by exact SHA, HEAD and tree verified).
# THE JOB FAILS if ANY test fails or if ANY required row is missing or not in its allowed label set: run_chain.py exits nonzero, and the run step uses
# `bash -eo pipefail`, so the pipe into tee cannot mask it. No tolerated FAIL row exists.
# No secrets, read-only token, no paid models, no network use by the tests themselves.
# Third-party actions are pinned by full commit SHA:
#   actions/checkout       v4.2.2 -> 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python   v5.6.0 -> a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact v4.6.2 -> ea165f8d65b6e75b540449e92b4886f43607fa02
name: R2 joined chain (private preview)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'r2_chain/**'
      - '.github/workflows/r2-joined-chain.yml'

permissions:
  contents: read

concurrency:
  group: r2-joined-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  joined-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the qualification repository at the exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python (pinned minor)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Fetch the pinned sources by exact SHA and verify HEAD and tree
        run: |
          bash r2_chain/fetch_sources.sh "$RUNNER_TEMP/src" | tee "$RUNNER_TEMP/sources-identity.tsv"

      - name: Install hash-locked dependencies (including hash-locked PyNaCl)
        run: |
          python -m pip install --require-hashes -r r2_chain/requirements.lock
          python -c "import nacl, pytest, pydantic, jsonschema; print('PyNaCl', nacl.__version__, 'pytest', pytest.__version__, 'pydantic', pydantic.VERSION)"
          git status --porcelain --untracked-files=all

      - name: Run the joined chain (pytest, junit, rows.jsonl, SHA-256 manifest)
        run: |
          mkdir -p "$RUNNER_TEMP/r2-evidence"
          cp "$RUNNER_TEMP/sources-identity.tsv" "$RUNNER_TEMP/r2-evidence/"
          # exit status is run_chain.py's: nonzero when any test fails or any required row is missing / not in its allowed label set (pipefail is on for `shell: bash`)
          SRC_DIR="$RUNNER_TEMP/src" python -B r2_chain/run_chain.py --src-dir "$RUNNER_TEMP/src" --out "$RUNNER_TEMP/r2-evidence" 2>&1 | tee "$RUNNER_TEMP/runner-console.txt"

      - name: Print the result summary and key evidence files to the log
        if: always()
        run: |
          python - "$RUNNER_TEMP/r2-evidence" <<'PY' || true
          import json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          s = json.loads((d / "summary.json").read_text())
          print("disposition:", s["disposition"])
          print("label_counts:", s["label_counts"])
          for p in s["problems"]:
              print("PROBLEM:", p)
          PY
          for f in summary.json positive-case.json source-identity.json environment.json rows.jsonl SHA256SUMS; do
            echo "===== $f ====="
            cat "$RUNNER_TEMP/r2-evidence/$f" || true
          done

      - name: Upload artifacts (pytest output, junit, summary, rows, environment, SHA-256)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2-joined-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-evidence
          retention-days: 90
          if-no-files-found: error
