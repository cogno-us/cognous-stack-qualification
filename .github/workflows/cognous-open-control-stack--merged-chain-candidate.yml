name: cognous-open-control-stack / Merged chain candidate
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: merged-chain-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        batch:
        - recovery
        - transport
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-open-control-stack
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/qualify-linux.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-action-manifest
        ref: 46c950bed37fe3812000895430bc0312d29e37ce
        path: .merged-chain-work/action_manifest
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-control-plane
        ref: d3dadee70bd319812b207389ab1e0f6efe511916
        path: .merged-chain-work/control_plane
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: c3c3ee7188b9367cf70b08074b9c40a5c70c94ac
        path: .merged-chain-work/moltbot_safe
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-replay-bundle
        ref: 459e4ba62fca49364aebb0050cd5fb2dd5a71bfa
        path: .merged-chain-work/replay_bundle
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-governance-evidence-pack
        ref: b4baccd823d2a73be276c1de745b19cf7c56a0d6
        path: .merged-chain-work/governance_evidence_pack
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/open-decision-evidence-standard
        ref: c5e9a0f3695ae836b803be06c46d2c669642ee03
        path: .merged-chain-work/odes
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-governed-exchange
        ref: a1cbc7b28f702283b0e4f3192bb43e4a9e618ebf
        path: .merged-chain-work/gax_imx_transport
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - name: Install qualification dependencies
      timeout-minutes: 4
      run: python -m pip install pytest pydantic jsonschema
    - name: Verify gate and timeout behavior
      timeout-minutes: 1
      run: python -m pytest -q tests/test_merged_chain_qualification_gate.py
    - name: Run two isolated repetitions
      timeout-minutes: 6
      env:
        BATCH: ${{ matrix.batch }}
      run: python tools/merged_chain_qualification.py --batch "$BATCH" --out "results/candidate-$BATCH"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: merged-chain-${{ matrix.batch }}-py${{ matrix.python }}-${{ github.sha }}
        path: results/candidate-${{ matrix.batch }}/
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-qualify-linux-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
