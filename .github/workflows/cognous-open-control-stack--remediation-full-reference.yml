name: cognous-open-control-stack / Nonselected remediation full-reference matrix
permissions:
  contents: read
concurrency:
  group: remediation-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-linux:
    name: remediation-qualify-linux (${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        batch:
        - authority
        - exchange
        - consumers
        - registry
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_revision || '9d45ab4389f9ac7b7cd0e3b8823fa2fde56d8503' }}
        persist-credentials: false
        repository: cogno-us/cognous-open-control-stack
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/qualify-linux.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Run bounded candidate batch twice
      env:
        BATCH: ${{ matrix.batch }}
      run: python tools/reference_release.py run --qualification-root _qualification --profile profiles/remediation-full-reference-20261015.json --batch
        "$BATCH" --results-dir "results/remediation-full-$BATCH"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: remediation-full-${{ matrix.batch }}
        path: results/remediation-full-${{ matrix.batch }}/
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-qualify-linux-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
  aggregate:
    name: remediation-aggregate
    needs: qualify-linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_revision || '9d45ab4389f9ac7b7cd0e3b8823fa2fde56d8503' }}
        persist-credentials: false
        repository: cogno-us/cognous-open-control-stack
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/aggregate.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Check aggregate gate behavior
      run: 'python -m pip install --require-hashes -r tools/requirements-release.lock

        python -m pytest -q tests/test_full_candidate_gate.py

        '
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: remediation-full-*
        path: candidate-artifacts
    - name: Require all batches and unchanged acceptance matrix
      shell: bash
      run: 'set -o pipefail

        mkdir -p results

        python -m tools.aggregate_full_candidate --profile profiles/remediation-full-reference-20261015.json --artifacts
        candidate-artifacts --out results/remediation-full-candidate 2>&1 | tee results/remediation-full-aggregate.log

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: remediation-full-gate
        path: 'results/remediation-full-candidate/

          results/remediation-full-aggregate.log

          '
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-aggregate-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
