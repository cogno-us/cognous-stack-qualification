# Security R1B targeted (developer observation) - OCS-254-R1B, remediation record Issue #256 (cogno-us/cognous-open-control-stack).
# Governing: Engineering Constitution cogno-us/cognous-engineering-constitution@1c2e920f4e58e07a52e8e2408a506cf7dbc1292b
# (TESTING_POLICY: a test must fail when the weakness is restored; BLOCKED, not PASS, when a prerequisite is unavailable; CA06 preserve evidence; CA16 no claim promotion).
#
# STATUS: developer observation on a GitHub-hosted runner. NOT Q7, NOT independent qualification, NOT certification; changes no release or production hold.
# Scope: ONLY the modified boundaries - Replay draft PR #82 (expected-effective-configuration-digest, caller-trusted match) and Exchange draft PR #64
# (replace-ref hardening). Success of any Replay case is a CALLER-TRUSTED CONFIGURATION MATCH, never REGISTRY_AUTHENTICATED.
# No rerun of the frozen S3 41 cases or the 244 cases (see r1b/README in the PR body). Self-contained: does not depend on s3/ or on PR #260.
# Unlike the S3 C3 observer this job FAILS on any FAIL/BLOCKED verdict or any surviving mutant.
# Pins (tag -> sha as used by the S3 workflow, verified there with git ls-remote on 2026-10-31):
#   actions/checkout v4.2.2 -> 11bd71901bbe5b1630ceea73d27597364c9af683 ; actions/setup-python v5.6.0 -> a26af69be951a213d495a4c3e4e4022e16d87065 ;
#   actions/upload-artifact v4.6.2 -> ea165f8d65b6e75b540449e92b4886f43607fa02
# Component SHAs are constants in r1b/tuple.json (printed with its sha256); fetched by exact SHA, HEAD and tree verified; no branch/tag substitution.
# Artifacts cannot be downloaded from the authoring sandbox: per-case verdicts are therefore ALSO emitted as check-run annotations and the job summary.
name: Security R1B targeted (developer observation)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'r1b/**'
      - '.github/workflows/security-r1b-targeted.yml'

permissions:
  contents: read

concurrency:
  group: security-r1b-targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  r1b-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the qualification repository at the exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python (pinned minor)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install hash-locked dependencies (pytest 8.3.5, pydantic 2.11.9; no other install)
        run: |
          python -m pip install --require-hashes -r .github/locks/pydantic-pytest-f8aeba.txt
          python -c "import pydantic, pytest; print('imports OK', pydantic.VERSION, pytest.__version__)"
          echo "R1B_OUT=$RUNNER_TEMP/r1b-out" >> "$GITHUB_ENV"
          echo "R1B_WORK=$RUNNER_TEMP/r1b-work" >> "$GITHUB_ENV"

      - name: Fetch exact SHAs, run Replay 71 and Exchange 35 targeted tests, run four mutations
        run: |
          set +e
          python r1b/run_r1b.py run --work "$R1B_WORK" --out "$R1B_OUT"
          rc=$?
          mkdir -p "$R1B_OUT"
          echo "$rc" > "$R1B_OUT/runner.rc"
          exit 0

      - name: Annotations - Replay per-case verdicts
        if: always()
        run: python r1b/run_r1b.py annotate --out "$R1B_OUT" --leg replay || true

      - name: Annotations - Exchange per-case verdicts
        if: always()
        run: python r1b/run_r1b.py annotate --out "$R1B_OUT" --leg exchange || true

      - name: Annotations - mutation verdicts
        if: always()
        run: python r1b/run_r1b.py annotate --out "$R1B_OUT" --leg mutation || true

      - name: Upload artifacts (junit, logs, tuple, identity, env, mutation outputs, verdict CSVs, SHA-256)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-r1b-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1b-out
          retention-days: 90
          if-no-files-found: error

      - name: Gate - fail on any FAIL, BLOCKED or surviving mutant
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          p = os.path.join(os.environ['R1B_OUT'], 'status.json')
          try:
              s = json.load(open(p))
          except (OSError, ValueError) as e:
              print('::error::status.json missing or unreadable (BLOCKED): ' + repr(e)); sys.exit(1)
          print(json.dumps(s, indent=1))
          if not s.get('ok'):
              print('::error::R1B targeted qualification not clean: FAIL/BLOCKED verdict, problem, or surviving mutant'); sys.exit(1)
          PY
