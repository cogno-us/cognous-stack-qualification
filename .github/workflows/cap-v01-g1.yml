# CAP v0.1 gate G1 independent qualification (hosted run). Register cogno-us/cognous-open-control-stack#259; contract: issues/259#issuecomment-6589180377.
#
# STATUS OF THIS RESULT: independent qualification TESTS of the Control Plane G1 head (configurable Registry authority profile ocs-authority-profile/0.1). Real Control Plane
# GovernedAgeWorkflow + real Registry verify_f4_selection_v2 (11 layers) + exact Ed25519Verifier (PyNaCl) + real Replay import; SYNTHETIC keys, mechanism only.
# NO durable anti-rollback (G2). Claim A only. Not an operational-trust, adoption or release claim. G2 is NOT tested here.
# THE JOB FAILS on any failure, error, skip or xfail, or if fewer tests than the expected count ran (cap_v01/junit_gate.py). No secrets, read-only token, no network use by tests.
# Third-party actions are pinned by full commit SHA (same as rw01-f4-poc-e2e.yml):
#   actions/checkout       v4.2.2 -> 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python   v5.6.0 -> a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact v4.6.2 -> ea165f8d65b6e75b540449e92b4886f43607fa02
name: CAP v0.1 G1 authority profile qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cap_v01/**'
      - '.github/workflows/cap-v01-g1.yml'

permissions:
  contents: read

concurrency:
  group: cap-v01-g1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'
  CAP_REQUIRE_FULL_HISTORY: '1'
  EXPECTED_MIN_TESTS: '254'

jobs:
  g1-battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the qualification repository at the exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout merged Control Plane G1 commit (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cogno-us/cognous-control-plane
          ref: 2ebc3e6669509caf0d93a5b1df8849e0efb641c9
          fetch-depth: 0
          path: _src/control_plane
          persist-credentials: false

      - name: Checkout Registry at its pin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cogno-us/cognous-ocs-registry
          ref: 7de0ec9f8471c7a2ff630eb4035fa24d60b5e2eb
          path: _src/registry
          persist-credentials: false

      - name: Checkout Replay at its pin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 6651abef2dfc0960b09907ed268db45e809ee814
          path: _src/replay
          persist-credentials: false

      - name: Set up Python (pinned minor)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install hash-locked dependencies (including hash-locked PyNaCl)
        run: |
          python -m pip install --require-hashes -r .github/locks/cryptography-pydantic-pytest-a9a750.txt
          python -m pip install --require-hashes -r .github/locks/jsonschema-pyyaml-c943d3.txt
          python -m pip install --require-hashes -r _src/registry/requirements-ed25519.lock.txt
          python -c "import nacl, pytest, pydantic; print('PyNaCl', nacl.__version__, 'pytest', pytest.__version__, 'pydantic', pydantic.VERSION)"

      - name: Run the G1 battery (pytest -rA, junit, tripwire, SHA-256 manifest)
        env:
          CAP_SRC_DIR: ${{ github.workspace }}/_src
          CAP_EVIDENCE_DIR: ${{ runner.temp }}/cap-v01-g1-evidence
        run: |
          mkdir -p "$CAP_EVIDENCE_DIR"
          cd cap_v01
          python -m pytest -rA --junitxml="$CAP_EVIDENCE_DIR/junit.xml" 2>&1 | tee "$CAP_EVIDENCE_DIR/pytest-rA.txt"

      - name: Junit gate (fails on any failure, error, skip, xfail or fewer tests than expected)
        run: |
          python cap_v01/junit_gate.py "$RUNNER_TEMP/cap-v01-g1-evidence/junit.xml" --min-tests "$EXPECTED_MIN_TESTS"

      - name: Print the SHA-256 manifest of the changed Control Plane files
        if: always()
        run: cat "$RUNNER_TEMP/cap-v01-g1-evidence/cp-changed-files.sha256" || true

      - name: Upload artifacts (pytest -rA output, junit, SHA-256 manifest)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cap-v01-g1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cap-v01-g1-evidence
          retention-days: 90
          if-no-files-found: error
