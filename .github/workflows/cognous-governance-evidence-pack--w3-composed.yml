name: cognous-governance-evidence-pack / W3 P4 composed candidate
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  composed:
    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.12'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: cogno-us/cognous-governance-evidence-pack
        ref: ${{ inputs.source_revision || '1e789c7d67a897097445faef1813fb0cd22d55e5' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-governance-evidence-pack --source-root
        "." --evidence "qualification-evidence/composed.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-replay-bundle
        ref: 6c08f797e204e316c74bbf7bb34ed5721c19a0c7
        path: upstream/w3-replay
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-execution-runtime
        ref: bd398f16c4cee329d2d0213afc3236ca9232d29e
        path: upstream/w2-runtime
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-control-plane
        ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
        path: upstream/w1-control
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-action-manifest
        ref: 8d1572d4f926c968a8704cb912a6e9d49166f74a
        path: upstream/w1-manifest
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Verify accepted producer and candidate Replay pins
      run: 'test "$(git -C upstream/w2-runtime rev-parse HEAD)" = "bd398f16c4cee329d2d0213afc3236ca9232d29e"

        test "$(git -C upstream/w1-control rev-parse HEAD)" = "e66e5f163c5d5c112ff345a2f332b4c3893ee183"

        test "$(git -C upstream/w1-manifest rev-parse HEAD)" = "8d1572d4f926c968a8704cb912a6e9d49166f74a"

        test "$(git -C upstream/w3-replay rev-parse HEAD)" = "6c08f797e204e316c74bbf7bb34ed5721c19a0c7"

        '
    - name: Install candidate consumers
      run: 'python -m pip install -e upstream/w3-replay

        python -m pip install -e ".[dev]"

        '
    - name: P2/P3/P4 candidate and historical tests
      run: 'pytest -q tests/test_w3_atomic_evidence.py tests/test_w3_composed_candidate.py

        pytest -q upstream/w3-replay/tests/test_w3_atomic_import.py upstream/w3-replay/tests/test_w3_compatibility_matrix.py

        '
    - name: Historical Evidence suite
      run: pytest -q tests/test_models.py tests/test_importer.py tests/test_validator.py
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-governance-evidence-pack-composed-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
