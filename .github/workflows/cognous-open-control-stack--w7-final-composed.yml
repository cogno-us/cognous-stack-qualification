name: cognous-open-control-stack / W7 final exact producer consumer qualification
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  composed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-open-control-stack
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/composed.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-action-manifest
        ref: 8d1572d4f926c968a8704cb912a6e9d49166f74a
        path: upstream/w1-manifest
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-control-plane
        ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
        path: upstream/w1-control
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: bd398f16c4cee329d2d0213afc3236ca9232d29e
        path: upstream/w2-runtime
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-replay-bundle
        ref: 4299e1b16cb5b80a32930ef7659a216b6baabc45
        path: upstream/w3-replay
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-governance-evidence-pack
        ref: 9c0098d216b788d29af46508b738eef884e5a68a
        path: upstream/w3-evidence
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Assert exact pins and existing lock separation
      run: 'test "$(git -C upstream/w1-manifest rev-parse HEAD)" = "8d1572d4f926c968a8704cb912a6e9d49166f74a"

        test "$(git -C upstream/w1-control rev-parse HEAD)" = "e66e5f163c5d5c112ff345a2f332b4c3893ee183"

        test "$(git -C upstream/w2-runtime rev-parse HEAD)" = "bd398f16c4cee329d2d0213afc3236ca9232d29e"

        test "$(git -C upstream/w3-replay rev-parse HEAD)" = "4299e1b16cb5b80a32930ef7659a216b6baabc45"

        test "$(git -C upstream/w3-evidence rev-parse HEAD)" = "9c0098d216b788d29af46508b738eef884e5a68a"

        python -c "import json; assert json.load(open(''component-lock.json''))[''runtime_profile'']==''merged-producers-v1''"

        '
    - name: Install exact accepted packages
      run: 'python -m pip install -e upstream/w1-control

        python -m pip install -e upstream/w3-replay

        python -m pip install -e ''upstream/w3-evidence[dev]''

        '
    - name: Capture actual source through Replay to Evidence
      env:
        PYTHONPATH: upstream/w2-runtime:upstream/w2-runtime/tests
      run: 'mkdir -p results/w7-final

        python upstream/w3-evidence/scripts/w3_capture_accepted_producer.py results/w7-final

        '
    - name: Qualify positive negative source and bounded consumer paths
      env:
        PYTHONPATH: upstream/w2-runtime:upstream/w2-runtime/tests
      run: 'python -m pytest -q upstream/w2-runtime/tests/test_local_authority_effect.py upstream/w2-runtime/tests/test_w2_refusal_history.py
        upstream/w2-runtime/tests/test_w2_stop_recovery.py --junitxml=results/w7-final/producer.xml

        python -m pytest -q upstream/w3-replay/tests/test_w3_atomic_import.py upstream/w3-replay/tests/test_w3_compatibility_matrix.py
        --junitxml=results/w7-final/replay.xml

        python -m pytest -q upstream/w3-evidence/tests/test_w3_atomic_evidence.py upstream/w3-evidence/tests/test_w3_composed_candidate.py
        --junitxml=results/w7-final/evidence.xml

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: w7-final-scoped-cross-repo-evidence
        path: results/w7-final/
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-composed-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
