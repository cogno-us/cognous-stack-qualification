name: Verifier mutation report (design S5, family T)
# Opt-in, report-only. Dispatch or workflow_call only: never on push, not a required check, selects nothing and changes no verdict,
# profile or pin. Runs the independent verifier as an external process over the frozen clean corpus and its generated mutants and the
# ODES fixtures, and (catalogue v3) the witnessed corpus with --witness/--holder-inventory, and uploads the ODES verification-report mutation report. The harness proof itself (stubs) runs in Catalog validation.
'on':
  workflow_dispatch:
    inputs:
      verifier_revision:
        description: cogno-us/cognous-open-control-stack-verifier commit under test
        required: true
        type: string
      odes_revision:
        description: cogno-us/open-decision-evidence-standard commit supplying the seed fixtures
        required: true
        type: string
      qualification_revision:
        description: Suite commit (blank uses the workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      verifier_revision:
        required: true
        type: string
      odes_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate revision inputs (40-hex commit SHAs only)
        env:
          V_REV: ${{ inputs.verifier_revision }}
          O_REV: ${{ inputs.odes_revision }}
          QUAL_REV: ${{ inputs.qualification_revision }}
        run: |
          for v in "$V_REV" "$O_REV"; do [[ "$v" =~ ^[0-9a-f]{40}$ ]] || { echo "revision input is not a 40-hex commit SHA"; exit 1; }; done
          [[ -z "$QUAL_REV" || "$QUAL_REV" =~ ^[0-9a-f]{40}$ ]] || { echo "qualification_revision is not a 40-hex commit SHA"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.qualification_revision || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack-verifier
          ref: ${{ inputs.verifier_revision }}
          path: components/verifier
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/open-decision-evidence-standard
          ref: ${{ inputs.odes_revision }}
          path: components/odes
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the checked-out revisions
        env:
          V_REV: ${{ inputs.verifier_revision }}
          O_REV: ${{ inputs.odes_revision }}
        run: |
          test "$(git -C components/verifier rev-parse HEAD)" = "$V_REV"
          test "$(git -C components/odes rev-parse HEAD)" = "$O_REV"
      - name: Install the verifier (standard library only) into its own environment
        run: |
          python -m venv "$RUNNER_TEMP/verifier-env"
          "$RUNNER_TEMP/verifier-env/bin/python" -m pip install ./components/verifier
      - name: Harness proof with stubs
        run: python -m unittest tests.test_verifier_mutation_harness tests.test_verifier_mutation_witnessed
      - name: Run the mutation harness
        env:
          PYTHONPATH: suites/verifier-mutation
          PYTHONDONTWRITEBYTECODE: '1'
          V_REV: ${{ inputs.verifier_revision }}
          O_REV: ${{ inputs.odes_revision }}
        run: |
          mkdir -p results/verifier-mutation
          python -m verifier_mutation report --odes components/odes --odes-revision "$O_REV" \
            --out results/verifier-mutation/mutation-report.json --per-operator results/verifier-mutation/per-operator.json --jobs 4 \
            --verifier-cmd "$RUNNER_TEMP/verifier-env/bin/cognous-verify {run_record} [--proposal {proposal_export}] [--manifest {manifest}] [--ledger {destination_ledger}] [--witness {witness}] [--holder-inventory {holder_inventory}] --source-revision $V_REV --json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verifier-mutation-report-${{ github.sha }}
          path: results/verifier-mutation
