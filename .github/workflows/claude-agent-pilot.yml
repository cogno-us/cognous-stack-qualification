name: Claude Opus 5.5 agent pilot
on:
  pull_request:
    paths:
      - 'tools/claude_agent_pilot.py'
      - 'tests/test_claude_agent_pilot.py'
      - 'tests/native/test_claude_native_tools.py'
      - 'qualification/serial/claude-opus-5-5.json'
      - '.github/workflows/claude-agent-pilot.yml'
      - 'qualification/serial/claude-campaign-20261015.json'
  push:
    branches: [main]
    paths: ['qualification/serial/claude-campaign-20261015.json']
  workflow_dispatch:
    inputs:
      campaign_authorized:
        description: Run the remaining authorized USD 20 campaign; repeat campaigns are blocked
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: claude-opus-5-5-pilot-campaign-20261015
  cancel-in-progress: false
jobs:
  offline-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --require-hashes --only-binary :all: -r tools/requirements-serial.lock'
      - run: python -m unittest discover -s tests -p test_claude_agent_pilot.py -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 4bb101ca6dd5ee8f821bc44a7af935b5e389562e
          path: _native-hub
          persist-credentials: false
      - name: Native tool boundary controls without model requests
        env:
          NATIVE_HUB_ROOT: ${{ github.workspace }}/_native-hub
        run: python -m unittest discover -s tests/native -v
  actual-agent:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.campaign_authorized))
    needs: offline-controls
    # Paid provider job: the repository owner must configure this environment with required reviewers
    # (docs/security-residuals-20261016.md); without reviewers the declaration alone does not gate the job.
    environment: paid-provider-pilots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: qualification
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: qualification
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 4bb101ca6dd5ee8f821bc44a7af935b5e389562e
          path: hub-native
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refuse automatic retries and additional campaign dispatches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('qualification/serial/claude-campaign-20261015.json').read_text())
          assert c == {'campaign_id':'claude-opus-5-5-pilot-20261015','authorized':True,'max_spend_usd':'20.00','provider_spend_limit_required':False,'trigger':'merge-pr-14-once'}
          PY
          gh api "repos/$GH_REPO/actions/workflows/claude-agent-pilot.yml/runs?per_page=100" > "$RUNNER_TEMP/campaign-runs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          runs=json.loads((Path(os.environ['RUNNER_TEMP'])/'campaign-runs.json').read_text())
          prior=[r for r in runs['workflow_runs'] if r['id']!=int(os.environ['GITHUB_RUN_ID']) and r['head_branch']=='main' and r['event'] in ('push','workflow_dispatch')]
          if prior or runs.get('total_count',0)>100:
              raise SystemExit('Campaign already dispatched. Preserve/download the existing ledger; do not reset the USD 20 authorization. Use reviewed local resume instructions.')
          PY
      - run: 'python -m pip install --require-hashes --only-binary :all: -r tools/requirements-serial.lock'
      - name: Run the one authorized synthetic campaign
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python tools/claude_agent_pilot.py --hub ../hub-native
          --output "$RUNNER_TEMP/claude-results"
          --ledger "$RUNNER_TEMP/claude-campaign/ledger.sqlite"
          --execute
      - name: Retain trial evidence and campaign accounting even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-opus-5-5-pilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-results/
            ${{ runner.temp }}/claude-campaign/
          retention-days: 90
          if-no-files-found: warn
