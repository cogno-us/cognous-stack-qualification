name: Claude Opus 5.5 agent pilot
on:
  pull_request:
    paths:
      - 'tools/claude_agent_pilot.py'
      - 'tests/test_claude_agent_pilot.py'
      - 'tests/native/test_claude_native_tools.py'
      - 'qualification/serial/claude-opus-5-5.json'
      - '.github/workflows/claude-agent-pilot.yml'
  workflow_dispatch:
    inputs:
      provider_spend_limit_confirmed:
        description: Dedicated provider budget control and remaining USD 20 campaign authorization confirmed
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: claude-opus-5-5-pilot-campaign-20261015
  cancel-in-progress: false
jobs:
  offline-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-serial.txt
      - run: python -m unittest discover -s tests -p test_claude_agent_pilot.py -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 4bb101ca6dd5ee8f821bc44a7af935b5e389562e
          path: _native-hub
          persist-credentials: false
      - name: Native tool boundary controls without model requests
        env:
          NATIVE_HUB_ROOT: ${{ github.workspace }}/_native-hub
        run: python -m unittest discover -s tests/native -v
  actual-agent:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provider_spend_limit_confirmed
    needs: offline-controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: qualification
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: qualification
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 4bb101ca6dd5ee8f821bc44a7af935b5e389562e
          path: hub-native
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refuse automatic retries and additional campaign dispatches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GH_REPO/actions/workflows/claude-agent-pilot.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/campaign-runs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          runs=json.loads((Path(os.environ['RUNNER_TEMP'])/'campaign-runs.json').read_text())
          prior=[r for r in runs['workflow_runs'] if r['id']!=int(os.environ['GITHUB_RUN_ID']) and r['head_branch']=='main']
          if prior or runs.get('total_count',0)>1:
              raise SystemExit('Campaign already dispatched. Preserve/download the existing ledger; do not reset the USD 20 authorization. Use reviewed local resume instructions.')
          PY
      - run: python -m pip install -r tools/requirements-serial.txt
      - name: Run the one authorized synthetic campaign
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python tools/claude_agent_pilot.py --hub ../hub-native
          --output "$RUNNER_TEMP/claude-results"
          --ledger "$RUNNER_TEMP/claude-campaign/ledger.sqlite"
          --execute --provider-spend-limit-confirmed
      - name: Retain trial evidence and campaign accounting even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-opus-5-5-pilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-results/
            ${{ runner.temp }}/claude-campaign/
          retention-days: 90
          if-no-files-found: warn
