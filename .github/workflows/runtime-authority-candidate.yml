name: Runtime authority candidate
on:
  pull_request:
    paths:
      - suites/runtime-authority/**
      - tools/run_runtime_authority.py
      - process/runtime-authority-candidate-2026-10-15.json
      - .github/workflows/runtime-authority-candidate.yml
  push:
    paths:
      - suites/runtime-authority/**
      - tools/run_runtime_authority.py
      - process/runtime-authority-candidate-2026-10-15.json
      - .github/workflows/runtime-authority-candidate.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-control-plane
          ref: 2a17b2ba147462a592d9b1882aad09d8a3eb7904
          path: components/control_plane
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: a9a4f75a9a880ba0ae2c3b5a01fcee0ae904e127
          path: components/runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 05345feeff343cc6195bc8f7f37a3eed25278969
          path: components/replay
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-governance-evidence-pack
          ref: 4ebb6caab6b92fb6c42066ac7f25e6f27ae80656
          path: components/evidence_pack
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.5 pydantic==2.13.5 cryptography==50.0.0
      - run: python tools/run_runtime_authority.py --components components --out results/runtime-authority
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-authority-${{ matrix.python }}-${{ github.sha }}
          path: results/runtime-authority
