name: Upstream Wiki refresh
on:
  workflow_dispatch:
  # The weekly schedule is paused while the release gate runs, so that no pull request changes the wiki import or its lock between the
  # freeze and the run. Run it by hand with workflow_dispatch; restore the cron '17 14 * * 1' after the gate.
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-wiki-refresh
  cancel-in-progress: false
jobs:
  refresh-and-open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out maintained importer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Credentials persist because the final step pushes the sync branch with the checkout token.
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12' # matches the cp312 wheel hashes in tools/requirements-ci.lock
      - name: Read upstream data without executing upstream code
        run: git clone --depth 1 https://github.com/nachi065/AI-Security-Wiki.git "$RUNNER_TEMP/ai-security-wiki"
      - name: Prepare pinned source update with license and attribution checks
        run: python3 tools/sync_ai_security_wiki.py --source-dir "$RUNNER_TEMP/ai-security-wiki" --accept-revision
      - name: Check provenance and importer rejection behavior
        run: |
          python3 tools/validate_catalog.py
          python3 -m pip install --require-hashes --only-binary=:all: -r tools/requirements-ci.lock
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Publish the validated generated update as a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- scenarios/ai-security-wiki sources/ai-security-wiki.lock.json; then
            echo "No upstream specification changes. No qualification scenarios executed."
            exit 0
          fi
          upstream_sha=$(python3 -c 'import json; print(json.load(open("sources/ai-security-wiki.lock.json"))["source_commit"])')
          branch="sync/ai-security-wiki-$upstream_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenarios/ai-security-wiki sources/ai-security-wiki.lock.json
          while IFS= read -r path; do
            case "$path" in
              scenarios/ai-security-wiki/*|sources/ai-security-wiki.lock.json) ;;
              *) echo "Refusing to publish changes outside generated paths: $path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git commit -m "Refresh AI Security Wiki specifications at $upstream_sha"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/wiki-pr-body.md" <<'BODY'
          Refresh the pinned AI Security Wiki reference cases and source metadata. The importer retained CC BY-SA 4.0, author credits, source identities and change notices. License changes, attribution removal and deleted source case IDs stop the workflow for explicit review.

          The originating workflow ran catalog/provenance validation and importer rejection tests before creating this commit. Only generated Wiki content and its source lock are changed. This pull request is not merged automatically: a maintainer reviews and merges it.

          No qualification scenarios were executed. This update changes no selected component pins, production permissions or historical results. Imported specifications remain NOT RUN and profile applicability remains unassessed.

          A PR created with GITHUB_TOKEN may not trigger other workflows. This workflow runs its checks before opening the pull request.
          BODY
          pr_url=$(gh pr create --base "$BASE_BRANCH" --head "$branch" --title "Refresh AI Security Wiki specifications" --body-file "$RUNNER_TEMP/wiki-pr-body.md")
          pr_number=$(gh pr view "$pr_url" --json number --jq '.number')
          echo "Opened validated Wiki refresh for owner review (not merged automatically): $pr_url"
