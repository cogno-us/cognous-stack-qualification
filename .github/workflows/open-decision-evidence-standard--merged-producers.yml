name: open-decision-evidence-standard / Merged producer compatibility
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: merged-producers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/open-decision-evidence-standard
        ref: ${{ inputs.source_revision || '25c7ad608c2e6fd9f450e075db6bbf3ee4091a49' }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-action-manifest
        ref: 46c950bed37fe3812000895430bc0312d29e37ce
        path: upstream/manifest
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-replay-bundle
        ref: 459e4ba62fca49364aebb0050cd5fb2dd5a71bfa
        path: upstream/replay
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-control-plane
        ref: d3dadee70bd319812b207389ab1e0f6efe511916
        path: upstream/control-plane
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: c3c3ee7188b9367cf70b08074b9c40a5c70c94ac
        path: upstream/executor
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite open-decision-evidence-standard --source-root "."
        --evidence ".qualification-evidence/qualify-linux.json"
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Install bounded qualification dependencies
      timeout-minutes: 4
      run: python -m pip install -e '.[dev]' -e upstream/replay -e upstream/control-plane pyyaml
    - name: Qualify exact merged producer pair
      timeout-minutes: 3
      env:
        ODES_V2_REPLAY_ROOT: upstream/replay
        ARB_V2_CONTROL_PLANE_ROOT: upstream/control-plane
        ARB_V2_MOLTBOT_ROOT: upstream/executor
        ARB_PINNED_MANIFEST_FIXTURE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
      run: 'mkdir -p artifacts

        timeout --kill-after=10s 150s python -m pytest -q qualification/test_merged_producer.py --basetemp=artifacts/pytest
        --junitxml=artifacts/junit.xml

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: merged-producers-${{ github.sha }}-py${{ matrix.python }}
        path: artifacts/
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-open-decision-evidence-standard-qualify-linux-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: .qualification-evidence/
        if-no-files-found: error
