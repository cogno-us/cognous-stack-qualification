name: cognous-open-control-stack / Context notification and recovery (manual diagnostic)
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: context-notification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: Linux / ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
        - profile: context-action
          tests: tests/test_context_action_profile.py
        - profile: notification
          tests: tests/test_notification_profile.py
        - profile: recovery
          tests: tests/test_sqlite_recovery_profile.py
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROFILE: ${{ matrix.profile }}
      TEST_FILE: ${{ matrix.tests }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-open-control-stack
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/profile.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - run: python -m pip install 'pytest>=8,<10' 'pydantic>=2,<3'
    - name: Exercise selected integration
      shell: bash
      run: "mkdir -p results\nif [ \"$PROFILE\" != recovery ]; then\n  python tools/bound_context_notification.py\
        \ --profile \"$PROFILE\" --results-dir \"results/$PROFILE\"\nfi\n"
    - name: Verify bounded integration and recovery
      run: timeout 120s python -m pytest -q "$TEST_FILE" --junitxml=results/tests.xml
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: context-notification-${{ matrix.profile }}
        path: results/
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-profile-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
