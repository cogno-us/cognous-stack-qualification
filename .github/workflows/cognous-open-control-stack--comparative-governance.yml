name: cognous-open-control-stack / Shared synthetic governance comparison
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        seed:
        - 1701
        - 1702
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      DO_NOT_TRACK: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        repository: cogno-us/cognous-open-control-stack
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/compare.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install pinned measurement dependencies
      run: python -m pip install -r benchmarks/governance/requirements.txt
    - name: Download and authenticate pinned OPA binary
      run: 'python - <<''PY''

        import hashlib, json, os, pathlib, urllib.request

        spec = json.loads(pathlib.Path(''benchmarks/governance/dependencies.json'').read_text())[''opa'']

        binary = pathlib.Path(os.environ[''RUNNER_TEMP'']) / ''opa''

        urllib.request.urlretrieve(spec[''url''], binary)

        assert hashlib.sha256(binary.read_bytes()).hexdigest() == spec[''sha256''], ''OPA checksum mismatch''

        binary.chmod(0o755)

        PY

        '
    - name: Validate scoring oracle
      run: python -m unittest discover -s tests -p test_comparative_governance.py -v
    - name: Run frozen plan and control-removal probes
      run: python tools/run_comparative_governance.py --opa "$RUNNER_TEMP/opa" --seed ${{ matrix.seed }} --output
        results/comparison
    - name: Observe adversarial corner cases (mismatches retained)
      run: python tools/run_comparative_governance.py --opa "$RUNNER_TEMP/opa" --seed ${{ matrix.seed }} --plan
        benchmarks/governance/corner-plan.json --observe-conformance --output results/corners
    - name: Publish corner summary
      if: always()
      run: "if test -f results/corners/summary.md; then\n  cat results/corners/summary.md >> \"$GITHUB_STEP_SUMMARY\"\
        \nelse\n  echo 'Corner battery incomplete; no result inferred.' >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: Publish job summary
      if: always()
      run: "if test -f results/comparison/summary.md; then\n  cat results/comparison/summary.md >> \"$GITHUB_STEP_SUMMARY\"\
        \nelse\n  echo 'Battery did not complete; inspect job logs. No PASS inferred.' >> \"$GITHUB_STEP_SUMMARY\"\
        \nfi\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: comparative-governance-${{ matrix.seed }}
        path: 'results/corners/results.json

          results/corners/summary.md

          benchmarks/governance/corner-plan.json

          results/comparison/results.json

          results/comparison/summary.md

          benchmarks/governance/plan.json

          benchmarks/governance/dependencies.json

          benchmarks/governance/requirements.txt

          '
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-compare-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
