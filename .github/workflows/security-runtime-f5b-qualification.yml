name: F5b-repaired runtime requalification
on:
  pull_request:
    paths:
      - process/security-runtime-f5b-20261016.json
      - suites/security-runtime/**
      - tools/run_security_runtime.py
      - tools/summarize_security_runtime.py
      - .github/workflows/security-runtime-f5b-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: cbea38e153806d244e5f4284d76485a89c6a2716
          path: _hub
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r _hub/tools/requirements-release.lock
      # Components and outputs live outside the checkout so the recorded
      # qualification_worktree_dirty reflects tracked sources only.
      - name: Repeat exact F5b merged-source cases twice with fresh stores
        run: |
          python tools/run_security_runtime.py --profile process/security-runtime-f5b-20261016.json --prepare-work --components "$RUNNER_TEMP/_components" --out "$RUNNER_TEMP/security-runtime-f5b/run-1"
          python tools/run_security_runtime.py --profile process/security-runtime-f5b-20261016.json --components "$RUNNER_TEMP/_components" --out "$RUNNER_TEMP/security-runtime-f5b/run-2"
      # Read-only re-verification; annotations stay readable via the REST API.
      - name: Re-verify run-1 and audit native rows
        run: python -I tools/summarize_security_runtime.py "$RUNNER_TEMP/security-runtime-f5b/run-1"
      - name: Re-verify run-2 and audit native rows
        run: python -I tools/summarize_security_runtime.py "$RUNNER_TEMP/security-runtime-f5b/run-2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f5b-requalification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/security-runtime-f5b/
          if-no-files-found: error
