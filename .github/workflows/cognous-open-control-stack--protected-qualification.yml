name: cognous-open-control-stack / Protected local worker qualification
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-open-control-stack
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/qualify.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Install declared qualification tools
      run: 'sudo apt-get update

        sudo apt-get install -y bubblewrap

        python -m pip install --require-hashes -r .github/locks/pydantic-pytest-165155.txt

        '
    - name: Record host profile without changing security policy
      run: "mkdir -p results/protected\npython - <<'PYHOST'\nimport json, os, platform, subprocess\nfrom pathlib\
        \ import Path\npaths = ['/etc/os-release', '/proc/sys/kernel/apparmor_restrict_unprivileged_userns', '/proc/sys/kernel/unprivileged_userns_clone',\
        \ '/proc/self/attr/current']\nobserved = {}\nfor path in paths:\n    try:\n        observed[path] = Path(path).read_text().strip()\n\
        \    except OSError as exc:\n        observed[path] = {'unavailable': type(exc).__name__}\nPath('results/protected/host-profile.json').write_text(json.dumps({\n\
        \    'runner_profile': 'ubuntu-22.04', 'platform': platform.platform(),\n    'uid': os.getuid(), 'bubblewrap':\
        \ subprocess.check_output(['bwrap', '--version'], text=True).strip(),\n    'observed': observed, 'security_overrides':\
        \ False}, indent=2))\nPYHOST\n"
    - name: Prepare exact selected dependency checkouts
      run: 'python - <<''PY''

        from pathlib import Path

        from tools.protected_qualification import checkouts

        checkouts(Path(''.protected-work'').resolve(), clone=True)

        PY

        '
    - name: Verify harness failure handling and actual pinned adapter cases
      run: 'mkdir -p results/protected

        python -m pytest -q tests/test_protected_qualification.py --junitxml=results/protected/verifier-tests.xml

        '
    - name: Run protected campaign twice
      run: python tools/protected_qualification.py --results-dir results/protected/campaign
    - name: Upload evidence including failures
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: protected-local-worker-evidence
        path: results/protected
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-qualify-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
