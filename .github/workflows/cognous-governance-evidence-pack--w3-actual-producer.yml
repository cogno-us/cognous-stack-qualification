name: cognous-governance-evidence-pack / W3 actual producer export qualification
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  actual-producer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-governance-evidence-pack
        ref: ${{ inputs.source_revision || '1e789c7d67a897097445faef1813fb0cd22d55e5' }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-replay-bundle
        ref: 4299e1b16cb5b80a32930ef7659a216b6baabc45
        path: upstream/w3-replay
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: bd398f16c4cee329d2d0213afc3236ca9232d29e
        path: upstream/w2-runtime
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-control-plane
        ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
        path: upstream/w1-control
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-action-manifest
        ref: 8d1572d4f926c968a8704cb912a6e9d49166f74a
        path: upstream/w1-manifest
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-governance-evidence-pack --source-root
        "." --evidence "qualification-evidence/actual-producer.json"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify producer and consumer pins
      run: 'test "$(git -C upstream/w3-replay rev-parse HEAD)" = "4299e1b16cb5b80a32930ef7659a216b6baabc45"

        test "$(git -C upstream/w2-runtime rev-parse HEAD)" = "bd398f16c4cee329d2d0213afc3236ca9232d29e"

        test "$(git -C upstream/w1-control rev-parse HEAD)" = "e66e5f163c5d5c112ff345a2f332b4c3893ee183"

        test "$(git -C upstream/w1-manifest rev-parse HEAD)" = "8d1572d4f926c968a8704cb912a6e9d49166f74a"

        '
    - name: Install accepted producer and consumer packages
      run: 'python -m pip install -e upstream/w1-control

        python -m pip install -e upstream/w3-replay

        python -m pip install -e ".[dev]"

        '
    - name: Execute actual accepted producer and composed consumers
      env:
        PYTHONPATH: upstream/w2-runtime:upstream/w2-runtime/tests
      run: python scripts/w3_capture_accepted_producer.py output/w3
    - name: Execute accepted W1 tenant and W2 stop/recovery source tests
      env:
        PYTHONPATH: upstream/w2-runtime:upstream/w2-runtime/tests
      run: 'pytest -q upstream/w2-runtime/tests/test_w2_refusal_history.py upstream/w2-runtime/tests/test_w2_stop_recovery.py
        --junitxml=output/w3/accepted-runtime-tests.xml

        pytest -q upstream/w2-runtime/tests/test_local_authority_effect.py -k tenant --junitxml=output/w3/accepted-tenant-tests.xml

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: w3-actual-producer-cases
        path: output/w3
        if-no-files-found: warn
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-governance-evidence-pack-actual-producer-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
