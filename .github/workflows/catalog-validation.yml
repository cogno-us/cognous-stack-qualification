name: Catalog validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate scenario specifications only
        run: |
          python3 tools/validate_catalog.py
          python3 -m pip install --require-hashes -r .github/locks/jsonschema-pyyaml-c943d3.txt
          python3 -m unittest discover -s tests -v
