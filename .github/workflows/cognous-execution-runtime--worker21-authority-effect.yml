name: cognous-execution-runtime / Worker21 local authority-effect profile
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  focused:
    name: successor qualification (Control Plane V02 1bee3696, pydantic>=2.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: ${{ inputs.source_revision || '4199a6c793cd9ec37a5fd451f7d99265dcf634fd' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-execution-runtime --source-root "." --evidence
        "qualification-evidence/focused.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-control-plane
        ref: 1bee3696ee6cd8037d142cdbcdb6020e052b0480
        path: pinned/control-plane
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-ocs-registry
        ref: 943ab1831e39fadac1eb2a414ae322ccfa09bc6a
        path: pinned/registry
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Install successor-compatible dependencies (pydantic>=2.12, PyNaCl; hash-locked)
      run: python -m pip install -q --require-hashes -r _qualification/.github/locks/pydantic212-pynacl-pytest-v06.txt
    - name: Run profile compatibility batch (legacy profile, now against Control Plane V02)
      timeout-minutes: 2
      env:
        PYTHONPATH: .:pinned/control-plane/src
      run: python -m pytest -q tests/test_profile_exclusivity.py tests/test_refund_intent.py
    - name: Run focused atomic profile suite (legacy profile, now against Control Plane V02)
      timeout-minutes: 2
      env:
        PYTHONPATH: .:pinned/control-plane/src
      run: python -m pytest -q tests/test_local_authority_effect.py tests/test_w2_refusal_history.py tests/test_w2_stop_recovery.py
    - name: Run successor-profile effect-time guard suite (includes the missing-support regression); a skip is a failure
      timeout-minutes: 5
      env:
        PYTHONPATH: .:pinned/control-plane/src
        OCS_REGISTRY_PIN_DIR: ${{ github.workspace }}/pinned/registry
      run: |
        python -m pytest -q -p no:cacheprovider -rs --junitxml=successor-junit.xml tests/test_registry_selection_effect_guard.py
        python - <<'PY'
        import sys
        import xml.etree.ElementTree as ET
        root = ET.parse("successor-junit.xml").getroot()
        suite = root if root.tag == "testsuite" else root.find("testsuite")
        tests, skipped, failures, errors = (int(suite.get(k, 0)) for k in ("tests", "skipped", "failures", "errors"))
        print(f"successor-profile suite: tests={tests} skipped={skipped} failures={failures} errors={errors}")
        sys.exit(0 if tests > 0 and skipped == 0 and failures == 0 and errors == 0 else 1)
        PY
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-execution-runtime-focused-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: |
          qualification-evidence/
          successor-junit.xml
        if-no-files-found: error
  legacy-pin-compat:
    name: legacy compatibility (older Control Plane pin e66e5f16; NOT successor qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: ${{ inputs.source_revision || '309e194c1b0a3de23e11e20133e6eaf88875e48a' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-execution-runtime --source-root "." --evidence
        "qualification-evidence/legacy-pin.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-control-plane
        ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
        path: pinned/control-plane
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - run: python -m pip install -q --require-hashes -r .github/locks/pydantic-pytest-75c3c1.txt
    - name: Run profile compatibility batch
      timeout-minutes: 2
      env:
        PYTHONPATH: .:pinned/control-plane/src
      run: python -m pytest -q tests/test_profile_exclusivity.py tests/test_refund_intent.py
    - name: Run focused atomic profile suite
      timeout-minutes: 2
      env:
        PYTHONPATH: .:pinned/control-plane/src
      run: python -m pytest -q tests/test_local_authority_effect.py tests/test_w2_refusal_history.py tests/test_w2_stop_recovery.py
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-execution-runtime-legacy-pin-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
