name: MVP acceptance (QGATE-05 one-shot, proposed)
# OCS-MVP-QGATE-05 / Worker C design. PROPOSED, non-authorizing: it selects nothing, authorizes nothing (release/production HOLD), changes no verdict and claims no
# independence, certification, Q7 or Tier 1. Qualification owns the oracle and every verdict; this workflow only runs the frozen candidate and records.
#
# ONE authorized execution, triggered ONLY by a push to the dedicated branch nm138/run-1 (the Actions API / workflow_dispatch is not reachable from the
# lead's environment; as QGATE-03). No pull_request, workflow_dispatch, schedule or tag trigger exists. Re-run attempts skip (run_attempt == 1 guard on both jobs), and
# the run refuses to start if the evidence branch nm138/evidence-run-1 already exists (a second push is an unauthorized second run). nm138/run-1 must never be
# pushed again after the first push. There is no workflow input: the tuple comes from process/mvp-acceptance/candidate-identity.inputs.json (8 full 40-hex shas, nothing
# floating, main never used for a pin) and is cross-checked against process/mvp-chain/tuple-pin.proposed.json.
#
# Commitment custody (G-12, no circularity): the workflow embeds NEITHER the commitment sha256 NOR the qualification revision. It checks out the hub repository
# (cogno-us/cognous-open-control-stack) at the DEDICATED custody branch nm138/custody-1 (ref = that branch, NOT the hub default branch) into components/custody-hub,
# records the resolved head sha of that branch, reads docs/mvp-recovery/nm138/custody/freeze-commitment.json (the workflow asserts the file path exists and the required
# fields are present), asserts GITHUB_SHA == qualification_revision and sha256(process/mvp-acceptance/candidate-commitment.proposed.v6.json) == candidate_commitment_sha256, and
# passes that value to the gate as the independent --expect-commitment-sha256. Any mismatch stops the run before a single test executes. The custody record is pushed ONCE to
# nm138/custody-1 and never force-pushed or amended.
#
# ORDER OF OPERATIONS (prerequisites, text only; nothing here can be checked by the workflow before it runs): (1) the custody record is pushed to the hub branch
# nm138/custody-1 BEFORE (2) the Qualification freeze tree (the exact commit that will be pushed, incl. oracle v8 / battery v2) is on Qualification `main`, because the
# anchor gate G-02c compares every frozen file with its blob on `main` and is INCOMPLETE for any file absent or different there; and only then (3) nm138/run-1 is pushed
# (once, at that same commit). If (1) or (2) is missing the run is spent without a verdict.
#
# Vehicle (Architect ruling Q14): (A) the exact-pin in-process composed chain (Control Plane, route-B execution, Replay, Evidence Pack, Verifier) and (B) the separate
# real-socket ingress and peer-boundary negative controls, both bound to the same frozen tuple and commitment. Permitted claim: "The frozen pinned classes compose
# end-to-end in the qualification harness, while the trusted ingress boundary is separately exercised on the real socket under the same frozen candidate." A live
# socket request does NOT produce the reconstructed Replay, Evidence Pack and Verifier evidence.
#
# Host: GitHub-hosted ubuntu-24.04 (never ubuntu-latest), CPython 3.13, hash-locked dependencies. Original profile controls are kept: Yama
# ptrace_scope >= 1 (as-found value recorded; if it is below 1 the provisioning step raises it to 1 with `sudo sysctl -w kernel.yama.ptrace_scope=1`, never lowers it, and
# an absent Yama is left absent so the boundary rows BLOCK), ingress as a dedicated non-root uid with an empty capability set (launcher + environment record), socket 0660,
# 0700 state tree, no ACLs, throwaway identities mvp-ingress / mvp-client / mvp-ipc. The IPC directory mode 2751 (setgid, group mvp-ipc) is the BOUNDED SYNTHETIC TEST
# configuration ratified for this qualification only (Architect D3): NOT a production setting; accepted residual = an outsider can stat a known socket name.
# The state tree is created under /var/lib/qgate05-ocs/tmp (TMPDIR of the chain group), never under /tmp or /opt (the ACL FAIL seen under /opt in QGATE-02/03).
#
# Parallelism: the three independent pytest groups (chain as root; d2-route-b; applicability) run CONCURRENTLY inside ONE job on one host. Matrix jobs are deliberately not
# used: tools/mvp_acceptance_gate.py binds every artifact to ONE run_id minted once by `resolve`, and the gate reads one run directory. No test is retried; the
# exit status of each group is recorded and judged by the gate, never suppressed. Every test step uses `shell: bash {0}` (no errexit), so evidence is always produced.
#
# Evidence: (a) one GitHub artifact (qgate05-run1-evidence) and (b) the evidence job appends the same tree to the append-only branch nm138/evidence-run-1 of THIS
# repository (contents: write in that job only; explicit refspec, never main, never force), with SHA256SUMS, so the lead can read it over git.
'on':
  push:
    branches:
      - nm138/run-1
permissions:
  contents: read
concurrency:
  group: nm138-run-1
  cancel-in-progress: false
jobs:
  acceptance:
    if: ${{ github.repository == 'cogno-us/cognous-stack-qualification' && github.event_name == 'push' && github.ref == 'refs/heads/nm138/run-1' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash {0}
    env:
      MVP_CP_DIR: ${{ github.workspace }}/components/control_plane
      MVP_RUNTIME_DIR: ${{ github.workspace }}/components/runtime
      MVP_REPLAY_DIR: ${{ github.workspace }}/components/replay
      MVP_PACK_DIR: ${{ github.workspace }}/components/evidence_pack
      MVP_ODES_DIR: ${{ github.workspace }}/components/odes
      MVP_VERIFIER_DIR: ${{ github.workspace }}/components/verifier
      MVP_MANIFEST_DIR: ${{ github.workspace }}/components/manifest
      MVP_HUB_DIR: ${{ github.workspace }}/components/hub
      MVP_PIN_FILE: ${{ github.workspace }}/results/mvp-acceptance/tuple-pin.resolved.json
      MVP_ACCEPTANCE_DIR: ${{ github.workspace }}/results/mvp-acceptance
      MVP_RESULTS_DIR: ${{ github.workspace }}/results/mvp-acceptance/mvp-chain
      MVP_IDENTITY_FILE: ${{ github.workspace }}/process/mvp-acceptance/candidate-identity.inputs.json
      D2_CONTROL_PLANE_DIR: ${{ github.workspace }}/components/control_plane
      D2_RUNTIME_DIR: ${{ github.workspace }}/components/runtime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the Qualification candidate (the pushed commit itself)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One-shot guard (attempt 1, branch nm138/run-1, commit == GITHUB_SHA, evidence branch absent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p results/mvp-acceptance/host-evidence
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || { echo "re-run attempts are not authorized"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/nm138/run-1" ] || { echo "wrong ref $GITHUB_REF"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "checkout HEAD != GITHUB_SHA"; exit 1; }
          # the token is passed as an HTTP header (never in a URL), so neither stdout nor stderr can echo it; stderr is additionally redacted before it is written to an artifact file
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/nm138/evidence-run-1 \
            > results/mvp-acceptance/host-evidence/evidence-branch-lsremote-before.txt 2> results/mvp-acceptance/host-evidence/evidence-branch-lsremote-before.err
          rc=$?
          sed -i -e 's#x-access-token:[^@ ]*#x-access-token:***#g' -e 's#\(AUTHORIZATION: *basic\) *[A-Za-z0-9+/=]*#\1 ***#Ig' results/mvp-acceptance/host-evidence/evidence-branch-lsremote-before.err
          echo "$rc" > results/mvp-acceptance/host-evidence/evidence-branch-lsremote-before.rc
          [ "$rc" = 0 ] || { echo "ls-remote failed rc=$rc (cannot establish that the run is unspent)"; exit 1; }
          if [ -s results/mvp-acceptance/host-evidence/evidence-branch-lsremote-before.txt ]; then
            echo "evidence branch nm138/evidence-run-1 already exists: the single authorized run is spent"; exit 1
          fi
          echo "guard PASS: attempt 1, ref $GITHUB_REF, sha $GITHUB_SHA, evidence branch absent"
      - name: Checkout the commitment custody record (hub repository DEDICATED branch nm138/custody-1, outside the candidate; not the default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: nm138/custody-1
          path: components/custody-hub
          sparse-checkout: docs/mvp-recovery/nm138/custody
          persist-credentials: false
      - name: Custody check (record path and required fields present; GITHUB_SHA == qualification_revision; recomputed commitment sha256 == the custody record; hub branch head recorded) before anything runs
        id: custody
        run: |
          set -eo pipefail
          rec=components/custody-hub/docs/mvp-recovery/nm138/custody/freeze-commitment.json
          [ -f "$rec" ] || { echo "custody record $rec is absent on hub branch nm138/custody-1"; exit 1; }
          python3 - "$rec" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          need = ("schema", "qualification_revision", "candidate_commitment_sha256")
          missing = [k for k in need if not d.get(k)]
          assert not missing, f"custody record lacks required fields {missing}"
          print("custody record present with required fields:", ", ".join(need))
          PY
          git -C components/custody-hub rev-parse HEAD | tee results/mvp-acceptance/host-evidence/custody-hub-branch-head.txt
          git -C components/custody-hub log -1 --format='%H %an %ad %s' | tee -a results/mvp-acceptance/host-evidence/custody-hub-branch-head.txt
          python3 tools/qgate05_custody_check.py \
            --record components/custody-hub/docs/mvp-recovery/nm138/custody/freeze-commitment.json \
            --commitment-file process/mvp-acceptance/candidate-commitment.proposed.v6.json \
            --commitment-rel process/mvp-acceptance/candidate-commitment.proposed.v6.json \
            --github-sha "$GITHUB_SHA" --repo-root . --hub-dir components/custody-hub \
            --out results/mvp-acceptance/custody-evidence.json --github-output "$GITHUB_OUTPUT"
      - name: Resolve the tuple from the candidate identity inputs (40-hex only, no overrides) and cross-check the tuple pin file
        id: tuple
        run: |
          set -eo pipefail
          mkdir -p results/mvp-acceptance/mvp-chain
          python3 tools/mvp_acceptance_gate.py resolve --identity process/mvp-acceptance/candidate-identity.inputs.json \
            --out-pin results/mvp-acceptance/tuple-pin.resolved.json --out-resolved results/mvp-acceptance/tuple-resolved.json \
            --github-output "$GITHUB_OUTPUT" --github-env "$GITHUB_ENV" \
            --qualification-sha "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          ident = json.load(open("process/mvp-acceptance/candidate-identity.inputs.json"))["components"]
          pin = json.load(open("process/mvp-chain/tuple-pin.proposed.json"))["components"]
          assert set(ident) == set(pin) and len(ident) == 8, (sorted(ident), sorted(pin))
          bad = {k: (ident[k]["sha"], pin[k]["sha"]) for k in ident if ident[k]["sha"] != pin[k]["sha"]}
          assert not bad, f"identity inputs and tuple pin file disagree: {bad}"
          print("tuple cross-check PASS: 8 components, identity inputs == tuple pin file")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: ${{ steps.tuple.outputs.control_plane }}
          path: components/control_plane
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: ${{ steps.tuple.outputs.runtime }}
          path: components/runtime
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: ${{ steps.tuple.outputs.replay }}
          path: components/replay
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/cognous-governance-evidence-pack
          ref: ${{ steps.tuple.outputs.evidence_pack }}
          path: components/evidence_pack
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/open-decision-evidence-standard
          ref: ${{ steps.tuple.outputs.odes }}
          path: components/odes
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/cognous-open-control-stack-verifier
          ref: ${{ steps.tuple.outputs.verifier }}
          path: components/verifier
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/cognous-action-manifest
          ref: ${{ steps.tuple.outputs.action_manifest }}
          path: components/manifest
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: ${{ steps.tuple.outputs.hub }}
          path: components/hub
          persist-credentials: false
      - name: Preflight the hub capture script (must exist with the pinned sha256; fail early, the gate stays the backup)
        run: |
          set -eo pipefail
          python3 tools/mvp_acceptance_gate.py preflight-hub --components-dir "$GITHUB_WORKSPACE/components"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install the hash-locked dependencies (the only network use besides checkout)
        run: |
          set -o pipefail
          python -m pip install --require-hashes -r .github/locks/cryptography-pydantic-pytest-a9a750.txt 2>&1 | tee results/mvp-acceptance/host-evidence/pip-install.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > results/mvp-acceptance/host-evidence/pip-install.rc
          [ "$rc" = 0 ]
      - name: Verify Python 3.13, pydantic >= 2.12 and that every checkout is exactly its pinned sha and pristine
        run: |
          set -eo pipefail
          python - <<'PY'
          import sys, pydantic
          assert sys.version_info[:2] == (3, 13), sys.version
          assert tuple(int(x) for x in pydantic.VERSION.split(".")[:2]) >= (2, 12), pydantic.VERSION
          print("python", sys.version.split()[0], "pydantic", pydantic.VERSION)
          PY
          python -VV > results/mvp-acceptance/host-evidence/python-version.txt 2>&1
          python -m pip freeze > results/mvp-acceptance/host-evidence/pip-freeze.txt 2>&1
          git config --global --add safe.directory '*'
          sudo git config --global --add safe.directory '*'
          python tools/mvp_acceptance_gate.py verify-checkouts --resolved results/mvp-acceptance/tuple-resolved.json --base "$GITHUB_WORKSPACE"
      - name: Provision the approved ingress profile (throwaway identities, /var/lib base path, read access); Yama as-found recorded and raised to 1 only if below 1 (never lowered)
        run: |
          bash tools/qgate05_host_setup.sh provision "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/results/mvp-acceptance/host-evidence"
          cat "$GITHUB_WORKSPACE/results/mvp-acceptance/host-evidence/yama-record.json" || true
          cat /proc/sys/kernel/yama/ptrace_scope || true
      - name: Record the run identity
        run: |
          python3 - <<'PY'
          import json, os, platform, subprocess
          def sh(c):
              return subprocess.run(c, shell=True, capture_output=True, text=True).stdout.strip()
          keys = ["GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_NUMBER", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_REF", "GITHUB_EVENT_NAME", "GITHUB_WORKFLOW",
                  "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "GITHUB_JOB", "GITHUB_ACTOR", "RUNNER_NAME", "RUNNER_OS", "RUNNER_ARCH", "RUNNER_ENVIRONMENT", "ImageOS", "ImageVersion"]
          doc = {k: os.environ.get(k) for k in keys}
          doc.update(run_url="%s/%s/actions/runs/%s" % (os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]),
                     kernel=platform.release(), uname=sh("uname -a"), yama_ptrace_scope=sh("cat /proc/sys/kernel/yama/ptrace_scope 2>&1"),
                     yama_record=sh("cat results/mvp-acceptance/host-evidence/yama-record.json 2>&1"),
                     os_release=sh("grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release"), python=sh("python -VV"),
                     capabilities_of_this_step=sh("grep -E '^Cap(Eff|Bnd):' /proc/self/status"), mvp_run_id=os.environ.get("MVP_RUN_ID"),
                     custody_commitment_sha256_passed_to_gate="${{ steps.custody.outputs.candidate_commitment_sha256 }}",
                     workflow_trigger="push to nm138/run-1, run_attempt==1; no retry path",
                     note="non-authorizing; QGATE-05; IPC dir 2751 is the bounded synthetic test configuration only (Architect D3), not production")
          os.makedirs("results/mvp-acceptance", exist_ok=True)
          open("results/mvp-acceptance/run-identity.json", "w").write(json.dumps(doc, indent=2, sort_keys=True) + "\n")
          print(json.dumps(doc, indent=2, sort_keys=True))
          PY
      - name: "Anchor the frozen files to the main branch (blob ids read through the REST API, independent of this checkout; NOT a pin: pins come from the identity file)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/mvp_acceptance_gate.py anchor --repo "$GITHUB_REPOSITORY" --ref main --out results/mvp-acceptance/anchor.json
          echo "anchor rc=$?"
      - name: Collect the mandatory battery (discovery is recorded separately from execution)
        run: |
          d=results/mvp-acceptance
          MVP_RESULTS_DIR="$d/collect-mvp-chain" python -m pytest --collect-only -q -p no:cacheprovider \
            suites/mvp-chain/test_mvp_chain.py suites/mvp-chain/test_verdict_engine.py suites/mvp-chain/test_ruling4_lost_ack.py \
            suites/mvp-chain/test_kwflow.py suites/mvp-chain/test_ingress_ambiguity.py suites/mvp-chain/test_process_kill_a1.py suites/mvp-chain/test_ledger_pruning_a2.py suites/mvp-chain/test_nc4_03_mutation_set.py suites/mvp-chain/test_nc4_03_host_subcases.py | tee "$d/collected-mvp-chain.txt"
          D2_CONTROL_PLANE_PIN="${{ steps.tuple.outputs.control_plane }}" MVP_RESULTS_DIR="$d/collect-d2-route-b" python -m pytest --collect-only -q -p no:cacheprovider \
            suites/mvp-d2-route-b/test_inventory_negatives.py | tee "$d/collected-d2-route-b.txt"
          MVP_RESULTS_DIR="$d/collect-applicability" python -m pytest --collect-only -q -p no:cacheprovider \
            suites/mvp-applicability/test_route_c_exclusion.py | tee "$d/collected-applicability.txt"
      - name: Run the three independent test groups CONCURRENTLY (chain as root with TMPDIR under /var/lib; route-B mediation; route C exclusion); no retry; each exit status is recorded and judged by the gate
        run: |
          d=results/mvp-acceptance
          # group 2: route-B effect-path mediation (architect ruling Q5; pins the Runtime and Control Plane themselves and fails, never skips, on a mismatch)
          ( D2_CONTROL_PLANE_PIN="${{ steps.tuple.outputs.control_plane }}" MVP_EXCLUSION_TAG=d2-route-b MVP_RESULTS_DIR="$d/mvp-d2-route-b" \
            PYTHONPATH="$GITHUB_WORKSPACE/suites/mvp-applicability/plugin" \
            python -m pytest -q -p no:cacheprovider -p exchange_exclusion_plugin suites/mvp-d2-route-b/test_inventory_negatives.py \
            -o junit_suite_name="mvp-acceptance-$MVP_RUN_ID-d2-route-b" --junitxml="$d/junit-d2-route-b.xml" > "$d/console-d2-route-b.txt" 2>&1
            echo $? > "$d/pytest-exit-d2-route-b.txt" ) &
          pid_d2=$!
          # group 3: route C (Exchange) exclusion checks (ruling 5)
          ( MVP_EXCLUSION_TAG=applicability PYTHONPATH="$GITHUB_WORKSPACE/suites/mvp-applicability/plugin" \
            python -m pytest -q -p no:cacheprovider -p exchange_exclusion_plugin suites/mvp-applicability/test_route_c_exclusion.py \
            -o junit_suite_name="mvp-acceptance-$MVP_RUN_ID-applicability" --junitxml="$d/junit-applicability.xml" > "$d/console-applicability.txt" 2>&1
            echo $? > "$d/pytest-exit-applicability.txt" ) &
          pid_app=$!
          # group 1: the chain battery as root (NC4 starts the ingress as the dedicated non-root uid and the client as another; the hub environment record is captured in-run
          # against that process). TMPDIR makes tempfile.mkdtemp create the NC4 state tree (and the real-kill harness work dir, also tempfile-based) under /var/lib/qgate05-ocs/tmp.
          # Plain sudo: no container, seccomp or sandbox, so a test may SIGKILL its own child.
          MVP_EXCLUSION_TAG=mvp-chain \
            sudo -E env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE/suites/mvp-applicability/plugin" "TMPDIR=$QG5_TMP" python -m pytest -q -p no:cacheprovider -p exchange_exclusion_plugin \
            suites/mvp-chain/test_mvp_chain.py suites/mvp-chain/test_verdict_engine.py suites/mvp-chain/test_ruling4_lost_ack.py \
            suites/mvp-chain/test_kwflow.py suites/mvp-chain/test_ingress_ambiguity.py suites/mvp-chain/test_process_kill_a1.py suites/mvp-chain/test_ledger_pruning_a2.py suites/mvp-chain/test_nc4_03_mutation_set.py suites/mvp-chain/test_nc4_03_host_subcases.py \
            -o junit_suite_name="mvp-acceptance-$MVP_RUN_ID-mvp-chain" --junitxml="$d/junit-mvp-chain.xml" > "$d/console-mvp-chain.txt" 2>&1
          echo $? > "$d/pytest-exit-mvp-chain.txt"
          wait "$pid_d2" "$pid_app"
          for g in mvp-chain d2-route-b applicability; do echo "group $g pytest exit: $(cat "$d/pytest-exit-$g.txt" 2>/dev/null || echo MISSING)"; tail -n 25 "$d/console-$g.txt"; done
      - name: Host state after the run (identities, base path, residue, state-tree listing and synthetic database/journal copies)
        if: always()
        run: |
          d=results/mvp-acceptance
          mkdir -p "$d/host-evidence" "$d/state-snapshot"
          bash tools/qgate05_host_setup.sh snapshot "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$d/host-evidence" post
          sudo find /var/lib/qgate05-ocs -printf '%p %U:%G %m %y %s\n' 2>&1 | sort > "$d/host-evidence/qgate05-base-listing-post.txt"
          # synthetic databases / journals / recovery files left by the tests (best effort; files > 50 MB are listed above, not copied)
          sudo find /var/lib/qgate05-ocs -type f \( -name '*.sqlite3*' -o -name '*.db*' -o -name '*journal*' -o -name '*.wal' -o -name '*.shm' -o -name '*.json' -o -name '*.jsonl' \) -size -50M \
            -exec cp --parents -p {} "$GITHUB_WORKSPACE/$d/state-snapshot" \; 2>"$d/host-evidence/state-snapshot-copy.err"
          sudo chown -R "$(id -u):$(id -g)" "$d" 2>/dev/null
          exit 0
      - name: Gate (zero unexplained skips in the mandatory battery, exact Verifier dispositions); the independent commitment comes from the custody record
        if: ${{ always() && steps.custody.outcome == 'success' }}
        env:
          COMMITMENT_SHA256: ${{ steps.custody.outputs.candidate_commitment_sha256 }}
        run: |
          python3 tools/mvp_acceptance_gate.py gate --run-dir results/mvp-acceptance --expect-qualification-sha "$(git rev-parse HEAD)" \
            --expect-commitment-sha256 "$COMMITMENT_SHA256" --require-python 3.13 \
            --components-dir "$GITHUB_WORKSPACE/components" | tee results/mvp-acceptance/gate-summary.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo "${PIPESTATUS[0]}" > results/mvp-acceptance/gate.rc
          echo "gate exit: $(cat results/mvp-acceptance/gate.rc)"
          exit 0
      - name: Summary of the run (read-only; categories kept distinct; changes no verdict)
        if: always()
        run: |
          python3 tools/qgate05_summarize.py --run-dir results/mvp-acceptance | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Checksums over the run directory
        if: always()
        run: |
          cd results/mvp-acceptance && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS; wc -l SHA256SUMS
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qgate05-run1-evidence
          path: results/mvp-acceptance
          retention-days: 90
          if-no-files-found: warn
      - name: Verdict (the job conclusion reflects the gate honestly; the evidence is already uploaded)
        if: always()
        run: |
          rc=$(cat results/mvp-acceptance/gate.rc 2>/dev/null || echo missing)
          echo "gate.rc=$rc custody=${{ steps.custody.outcome }}"
          if [ "$rc" != "0" ]; then
            echo "::error::QGATE-05 gate is not ACCEPT (gate.rc=$rc; 1=REJECT, 2=INCOMPLETE, missing=gate did not run). Evidence uploaded; failure preserved. This is not an acceptance, certification or release decision."
            exit 1
          fi
  evidence:
    # Appends the complete raw evidence to the append-only evidence branch. contents: write is granted to THIS job only; the push uses an explicit refspec to
    # refs/heads/nm138/evidence-run-1 (never main, never a tag, never --force). Runs even when the acceptance job failed.
    needs: acceptance
    if: ${{ always() && needs.acceptance.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/nm138/run-1' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qgate05-run1-evidence
          path: evidence-in
      - name: Commit the evidence to nm138/evidence-run-1 (append-only; fast-forward only; no force)
        env:
          GH_TOKEN: ${{ github.token }}
          QG5_WORKFLOW_SHA: ${{ github.workflow_sha }}
          QG5_JOB_STATUS: ${{ needs.acceptance.result }}
        run: |
          bash tools/qgate05_evidence_commit.sh evidence-in
