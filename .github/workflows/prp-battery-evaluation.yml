name: PRP 96-trial actual OpenAI battery
on:
  push:
    branches: [evaluation/prp-battery-20261015]
    paths: ['qualification/serial/prp-battery-20261015.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: prp-battery-20261015
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/portable-reasoning-protocol
          ref: b3ffa8559db05188f3471c5b0bfe5d936a4bcb29
          path: _prp
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-serial.txt
      - name: Offline fixture scorer tool and accounting controls
        run: python -m unittest discover -s tests -p test_prp_battery_evaluation.py -v
      - name: Refuse repeated paid campaign
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GH_REPO/actions/workflows/prp-battery-evaluation.yml/runs?per_page=100" > "$RUNNER_TEMP/prp-battery-runs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'prp-battery-runs.json').read_text())
          prior=[r for r in data['workflow_runs'] if r['id']!=int(os.environ['GITHUB_RUN_ID']) and r['head_branch']=='evaluation/prp-battery-20261015']
          assert not prior and data.get('total_count',0)<=100, 'Campaign already dispatched; preserve accounting'
          PY
      - name: Execute frozen battery with actual OpenAI calls
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/prp_battery_evaluation.py --prp _prp --output "$RUNNER_TEMP/prp-battery-results" --execute
      - name: Retain evidence and spend ledger even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-battery-${{ github.run_id }}
          path: ${{ runner.temp }}/prp-battery-results/
          retention-days: 90
          if-no-files-found: warn
