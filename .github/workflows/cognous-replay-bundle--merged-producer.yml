name: cognous-replay-bundle / Merged producer compatibility Linux
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        path: replay
        repository: cogno-us/cognous-replay-bundle
        ref: ${{ inputs.source_revision || '83fbaf2a0f6f071aca1ea0af859eb8fc6385c26a' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-replay-bundle --source-root "replay" --evidence
        "qualification-evidence/qualify.json"
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-control-plane
        ref: d3dadee70bd319812b207389ab1e0f6efe511916
        path: control-plane
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: c3c3ee7188b9367cf70b08074b9c40a5c70c94ac
        path: executor
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-action-manifest
        ref: 46c950bed37fe3812000895430bc0312d29e37ce
        path: manifest
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install test dependencies
      working-directory: replay
      run: timeout 180 python -m pip install -e '.[dev]'
    - name: Qualify actual merged producers
      working-directory: replay
      env:
        ARB_V2_CONTROL_PLANE_ROOT: ${{ github.workspace }}/control-plane
        ARB_V2_MOLTBOT_ROOT: ${{ github.workspace }}/executor
        ARB_PINNED_MANIFEST_FIXTURE: ${{ github.workspace }}/manifest/examples/refund_integration_v1_1.manifest.json
        ARB_MERGED_RESULTS: ${{ github.workspace }}/replay/results/merged-producer
      run: timeout 120 python -m pytest -q qualification/test_merged_producer.py --junitxml=results/merged-producer.xml
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: merged-producer-compatibility
        path: replay/results
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-replay-bundle-qualify-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
