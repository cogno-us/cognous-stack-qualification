name: Security evidence tooling
on:
  pull_request:
    paths:
      - 'tools/security_coverage.py'
      - 'tools/check_public_links.py'
      - 'tests/test_security_coverage.py'
      - 'tests/test_public_link_checker.py'
      - 'results/security-coverage-20261015/**'
      - '.github/workflows/security-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'tools/security_coverage.py'
      - 'tools/check_public_links.py'
      - 'tests/test_security_coverage.py'
      - 'tests/test_public_link_checker.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-tools:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_security_coverage.py -v
      - run: python -m unittest discover -s tests -p test_public_link_checker.py -v
      - name: Verify immutable retained evidence checksums
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('results/security-coverage-20261015')
          for name,expected in json.loads((root/'sha256.json').read_text()).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          PY
