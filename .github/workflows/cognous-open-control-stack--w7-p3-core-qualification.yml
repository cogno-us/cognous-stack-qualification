name: cognous-open-control-stack / W7 P3 exact producer core qualification
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  core-producers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-open-control-stack
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-action-manifest
        ref: 8d1572d4f926c968a8704cb912a6e9d49166f74a
        path: pinned/manifest
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-control-plane
        ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
        path: pinned/control-plane
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: bd398f16c4cee329d2d0213afc3236ca9232d29e
        path: pinned/runtime
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/core-producers.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: python -m pip install -q pytest pydantic
    - name: Verify exact source revisions and preserved historic lock
      run: 'test "$(git -C pinned/manifest rev-parse HEAD)" = "8d1572d4f926c968a8704cb912a6e9d49166f74a"

        test "$(git -C pinned/control-plane rev-parse HEAD)" = "e66e5f163c5d5c112ff345a2f332b4c3893ee183"

        test "$(git -C pinned/runtime rev-parse HEAD)" = "bd398f16c4cee329d2d0213afc3236ca9232d29e"

        python -c "import json; assert json.load(open(''component-lock.json''))[''runtime_profile'']==''merged-producers-v1''"

        '
    - name: Execute W1/W2 real destination regression suites
      working-directory: pinned/runtime
      env:
        PYTHONPATH: .:../control-plane/src
      run: 'mkdir -p ../../results/w7-p3

        python -m pytest -q -rs --junitxml=../../results/w7-p3/producer-cases.xml tests/test_local_authority_effect.py
        tests/test_w2_refusal_history.py tests/test_w2_stop_recovery.py

        '
    - name: Require zero skipped/failed/error cases
      if: always()
      run: 'python - <<''PY''

        import xml.etree.ElementTree as E

        root=E.parse(''results/w7-p3/producer-cases.xml'').getroot()

        suites=[root] if root.tag==''testsuite'' else list(root.findall(''testsuite''))

        cases=sum(int(x.attrib.get(''tests'',0)) for x in suites)

        failures=sum(int(x.attrib.get(''failures'',0)) for x in suites)

        errors=sum(int(x.attrib.get(''errors'',0)) for x in suites)

        skips=sum(int(x.attrib.get(''skipped'',0)) for x in suites)

        print(dict(tests=cases,failures=failures,errors=errors,skipped=skips))

        if cases < 1 or failures or errors or skips: raise SystemExit(1)

        PY

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: w7-p3-exact-producer-cases
        path: results/w7-p3/
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-core-producers-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
