name: Cross-component migration integrity
on:
  push:
    paths: ['suites/**', 'migrations/**', 'tools/install_suite.py', 'tools/run_suite.py', 'tools/validate_migrations.py', 'tests/test_suite_install.py', '.github/workflows/*--*.yml', '.github/workflows/migration-integrity.yml']
  pull_request:
    paths: ['suites/**', 'migrations/**', 'tools/install_suite.py', 'tools/run_suite.py', 'tools/validate_migrations.py', 'tests/test_suite_install.py', '.github/workflows/*--*.yml', '.github/workflows/migration-integrity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r .github/locks/jsonschema-pyyaml-c943d3.txt
      - run: python tools/validate_catalog.py
      - run: python tools/validate_migrations.py
      - run: python -m unittest discover -s tests -v
