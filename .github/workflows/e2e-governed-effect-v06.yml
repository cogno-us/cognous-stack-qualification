name: E2E governed effect qualification (V06)
on:
  pull_request:
    paths:
      - suites/e2e-governed-effect/**
      - .github/locks/pydantic212-pynacl-pytest-v06.*
      - .github/workflows/e2e-governed-effect-v06.yml
      - .github/workflows/cognous-execution-runtime--worker21-authority-effect.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    name: e2e governed effect (Registry 943ab183 / Control Plane V02 1bee3696 / Runtime V05 4199a6c7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-ocs-registry
          ref: 943ab1831e39fadac1eb2a414ae322ccfa09bc6a
          path: components/registry
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-control-plane
          ref: 1bee3696ee6cd8037d142cdbcdb6020e052b0480
          path: components/control_plane
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 4199a6c793cd9ec37a5fd451f7d99265dcf634fd
          path: components/runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-control-plane
          ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
          path: components/control_plane_legacy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q --require-hashes -r .github/locks/pydantic212-pynacl-pytest-v06.txt
      - name: Run V06 end-to-end cases (a skip or missing pin fails the run)
        env:
          V06_COMPONENTS_DIR: ${{ github.workspace }}/components
          V06_EVIDENCE_DIR: ${{ github.workspace }}/v06-evidence
        run: |
          python -m pytest suites/e2e-governed-effect -q -p no:cacheprovider -rA --junitxml=v06-evidence/junit.xml
          python - <<'PY'
          import json, sys
          doc = json.load(open("v06-evidence/results.json"))
          c = doc["counts"]
          print(json.dumps({"counts": c, "pins": doc["exact_pins"], "environment": doc["environment"]}, indent=1))
          sys.exit(0 if c["executed"] > 0 and c["SKIP"] == 0 and c["FAILED"] == 0 else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v06-e2e-evidence-${{ github.sha }}
          path: v06-evidence
          if-no-files-found: error
  worker21-reusable:
    name: Worker21 reusable workflow (successor on V02 + legacy on older pin)
    uses: ./.github/workflows/cognous-execution-runtime--worker21-authority-effect.yml
    with:
      source_revision: 4199a6c793cd9ec37a5fd451f7d99265dcf634fd
      qualification_revision: ${{ github.event.pull_request.head.sha || github.sha }}
