name: Operation identity profile (N1)
# Opt-in operation-identity/0.1 composed scenarios across the control plane and the execution runtime.
# Dispatch or workflow_call only: it never runs on push, selects nothing and changes no verdict. Component CI calls it with the
# exact component revisions under test. A missing or mismatched checkout fails the job; nothing here skips.
'on':
  workflow_dispatch:
    inputs:
      control_plane_revision:
        description: cogno-us/cognous-control-plane commit under test
        required: true
        type: string
      runtime_revision:
        description: cogno-us/cognous-execution-runtime commit under test
        required: true
        type: string
      qualification_revision:
        description: Suite commit (blank uses the workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      control_plane_revision:
        required: true
        type: string
      runtime_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.qualification_revision || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-control-plane
          ref: ${{ inputs.control_plane_revision }}
          path: components/control_plane
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: ${{ inputs.runtime_revision }}
          path: components/runtime
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.5 pydantic==2.13.5 cryptography==50.0.0
      - name: Verify the checked-out revisions
        run: |
          test "$(git -C components/control_plane rev-parse HEAD)" = "${{ inputs.control_plane_revision }}"
          test "$(git -C components/runtime rev-parse HEAD)" = "${{ inputs.runtime_revision }}"
      - name: Run the operation-identity suite
        env:
          OI_CONTROL_PLANE_DIR: ${{ github.workspace }}/components/control_plane
          OI_RUNTIME_DIR: ${{ github.workspace }}/components/runtime
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider suites/operation-identity --junitxml=results/operation-identity/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operation-identity-${{ matrix.python }}-${{ github.sha }}
          path: results/operation-identity
