name: Evidence registry / Chain and BitRep qualification
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: source_revision
        required: false
        type: string
      qualification_revision:
        description: qualification_revision
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-evidence-registry
        ref: ${{ inputs.source_revision || '650903fd6db1d68810dd377ba09e801a76682935' }}
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-evidence-attestation
        ref: 981036c315856c71207984797b0c4e48d3b3921d
        path: pinned/bitrep
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Assemble test drivers and retain both source identities
      run: python3 _qualification/tools/install_suite.py --suite cognous-evidence-registry --source-root . --evidence
        qualification-evidence/chain.json
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install exact-source test dependencies
      run: 'python -m pip install --require-hashes -r pinned/bitrep/requirements.txt

        python -m pip install -r requirements-dev.txt

        npm ci --ignore-scripts --no-audit --no-fund --prefix chain'
    - name: Verify clean pinned BitRep and exercise synthetic chain binding
      working-directory: chain
      env:
        BITREP_ROOT: ${{ github.workspace }}/pinned/bitrep
        PYTHONDONTWRITEBYTECODE: '1'
      run: 'test "$(git -C ../pinned/bitrep rev-parse HEAD)" = 981036c315856c71207984797b0c4e48d3b3921d

        python python/test_bitrep.py

        node --test test/protocol.test.mjs'
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-registry-chain
        path: qualification-evidence/
        if-no-files-found: error
