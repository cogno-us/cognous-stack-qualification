name: PRP proportional effort corrected interfaces
on:
  push:
    branches: [evaluation/prp-proportional-repair-20261015]
    paths: ['qualification/serial/prp-proportional-repair-20261015.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: prp-proportional-repair-20261015
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/portable-reasoning-protocol
          ref: b3ffa8559db05188f3471c5b0bfe5d936a4bcb29
          path: _prp
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-serial.txt
      - name: Offline measurement and scorer controls
        run: python -m unittest discover -s tests -p test_prp_proportional_evaluation.py -v
      - name: Refuse repeated paid run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GH_REPO/actions/workflows/prp-proportional-repair-evaluation.yml/runs?per_page=100" > "$RUNNER_TEMP/prp-proportional-runs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'prp-proportional-runs.json').read_text())
          prior=[r for r in d['workflow_runs'] if r['id']!=int(os.environ['GITHUB_RUN_ID']) and r['head_branch']=='evaluation/prp-proportional-repair-20261015']
          assert not prior and d.get('total_count',0)<=100, 'Paid campaign already dispatched'
          PY
      - name: Run one frozen proportionality comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/prp_proportional_evaluation.py --prp _prp --output "$RUNNER_TEMP/prp-proportional-results" --execute
      - name: Retain source snapshot and results even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/prp-proportional-results/source"
          cp tools/prp_proportional_evaluation.py tools/prp_proportional_cases.py tools/openai_agent_pilot.py tools/claude_agent_pilot.py tools/trajectory_contract.py "$RUNNER_TEMP/prp-proportional-results/source/"
          cp qualification/serial/prp-proportional-repair-20261015.json qualification/serial/prp-proportional-repair-cases-20261015.json "$RUNNER_TEMP/prp-proportional-results/source/"
      - name: Retain full evidence and ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-proportional-${{ github.run_id }}
          path: ${{ runner.temp }}/prp-proportional-results/
          retention-days: 90
          if-no-files-found: warn
