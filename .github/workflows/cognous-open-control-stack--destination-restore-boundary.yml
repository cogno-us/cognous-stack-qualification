name: cognous-open-control-stack / Destination restore boundary (S3 lane C)
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  characterize:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
    env:
      RESTORE_BOUNDARY_RESULTS: results/restore-cases
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        repository: cogno-us/cognous-open-control-stack
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/characterize.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r tools/requirements-federated-governance.txt 'pydantic>=2,<3'
    - name: Characterize actual destination and selected optional same-host C1
      run: 'mkdir -p results

        git rev-parse HEAD > results/source-revision.txt

        sha256sum component-lock.json reference_profiles/protected_destination.py tests/test_destination_restore_boundary.py
        > results/source-sha256.txt

        python -m pip freeze > results/dependencies.txt

        timeout 420s python -m pytest -q tests/test_destination_restore_boundary.py tests/test_protected_destination.py
        --junitxml=results/tests.xml

        '
    - name: Hash retained evidence
      if: always()
      run: find results -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > results/SHA256SUMS
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: destination-restore-boundary-${{ matrix.python }}
        path: results/
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-characterize-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
