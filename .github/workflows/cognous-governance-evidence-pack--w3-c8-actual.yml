name: cognous-governance-evidence-pack / W3 C8 actual source-to-consumer qualification
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  actual-c8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: cogno-us/cognous-governance-evidence-pack
        ref: ${{ inputs.source_revision || '1e789c7d67a897097445faef1813fb0cd22d55e5' }}
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-governance-evidence-pack --source-root
        "." --evidence "qualification-evidence/actual-c8.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-execution-runtime
        ref: ad9d8ffffb00aabfc4e1c53708ff00b59e0dbb4f
        path: upstream/runtime-c8
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-control-plane
        ref: e66e5f163c5d5c112ff345a2f332b4c3893ee183
        path: upstream/control
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        repository: cogno-us/cognous-replay-bundle
        ref: 7536e9ef124d2e106f17012024e05a84a31a03f4
        path: upstream/replay-c8
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
    - name: Verify pinned source and consumer revisions
      run: 'test "$(git -C upstream/runtime-c8 rev-parse HEAD)" = "ad9d8ffffb00aabfc4e1c53708ff00b59e0dbb4f"

        test "$(git -C upstream/control rev-parse HEAD)" = "e66e5f163c5d5c112ff345a2f332b4c3893ee183"

        test "$(git -C upstream/replay-c8 rev-parse HEAD)" = "7536e9ef124d2e106f17012024e05a84a31a03f4"

        '
    - name: Install accepted authority and candidate consumers
      run: 'python -m pip install -e upstream/control

        python -m pip install -e upstream/replay-c8

        python -m pip install -e ".[dev]"

        '
    - name: Run actual local source-to-consumer C8 qualification
      env:
        PYTHONPATH: upstream/runtime-c8:upstream/runtime-c8/tests
      run: python scripts/w3_c8_actual_source.py output/c8
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: w3-c8-source-record-lineage
        path: output/c8/
        if-no-files-found: warn
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-governance-evidence-pack-actual-c8-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: qualification-evidence/
        if-no-files-found: error
