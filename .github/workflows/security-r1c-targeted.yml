# Security R1C targeted (developer observation on CANDIDATE heads) - OCS-254-R1C, remediation record Issue #256 (cogno-us/cognous-open-control-stack).
# Governing: Engineering Constitution cogno-us/cognous-engineering-constitution@1c2e920f4e58e07a52e8e2408a506cf7dbc1292b
# (TESTING_POLICY: a test must fail when the weakness is restored; BLOCKED, not PASS, when a prerequisite is unavailable; CA06 preserve evidence; CA16 no claim promotion).
#
# STATUS: developer observation on a GitHub-hosted runner. NOT Q7, NOT independent qualification, NOT certification; changes no release or production hold.
# Scope: ONLY the affected boundaries - ODES candidate PR #143 and Evidence Pack candidate PR #66 (Replay 6f45e288 re-tie), Replay main 6f45e288 (caller-trusted expected-digest
# retained; structural-only still UNQUALIFIED), Exchange main 8fa8d3e7 (replace-ref hardening retained), CP b19c47dd / Replay FAMILY_TABLE parity. No rerun of the 41 or 244 cases.
# ODES and Pack heads are CANDIDATE heads, not merge SHAs: after the operator merges them, rebinding means editing r1c/tuple.json and re-running (separate follow-up).
# A Replay trusted match is a CALLER-TRUSTED CONFIGURATION MATCH only, never Registry authentication. This job FAILS on any FAIL/BLOCKED verdict or surviving mutant.
# Pins as in security-r1b-targeted.yml: actions/checkout v4.2.2 -> 11bd7190...; setup-python v5.6.0 -> a26af69b...; upload-artifact v4.6.2 -> ea165f8d...
# Component SHAs are constants in r1c/tuple.json (printed with its sha256); fetched by exact SHA, HEAD and tree verified; no branch/tag substitution.
# Artifacts cannot be downloaded from the authoring sandbox: per-test verdicts are ALSO emitted as check-run annotations and the job summary.
name: Security R1C targeted (developer observation)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'r1c/**'
      - '.github/workflows/security-r1c-targeted.yml'

permissions:
  contents: read

concurrency:
  group: security-r1c-targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  r1c-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the qualification repository at the exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python (pinned minor)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install hash-locked dependencies (pytest 8.3.5, pydantic 2.13.5, cryptography 50.0.0, jsonschema 4.23.0; no other install)
        run: |
          python -m pip install --require-hashes -r r1c/locks/r1c-pytest-pydantic-cryptography-jsonschema.txt
          python -c "import pydantic, pytest, cryptography, jsonschema; print('imports OK', pydantic.VERSION, pytest.__version__)"
          echo "R1C_OUT=$RUNNER_TEMP/r1c-out" >> "$GITHUB_ENV"
          echo "R1C_WORK=$RUNNER_TEMP/r1c-work" >> "$GITHUB_ENV"

      - name: Fetch exact SHAs, run the targeted legs A-H and parity, run six mutations
        run: |
          set +e
          python r1c/run_r1c.py run --work "$R1C_WORK" --out "$R1C_OUT"
          rc=$?
          mkdir -p "$R1C_OUT"
          echo "$rc" > "$R1C_OUT/runner.rc"
          exit 0

      - name: Annotations - A and C (new Replay accepted; mixed/superseded refused)
        if: always()
        run: python r1c/run_r1c.py annotate --out "$R1C_OUT" --legs A1,A2,C1,C2 || true

      - name: Annotations - B historical profiles and H suites
        if: always()
        run: python r1c/run_r1c.py annotate --out "$R1C_OUT" --legs B1,B2,H1,H2 || true

      - name: Annotations - D and E (Replay trusted match retained; structural-only unqualified)
        if: always()
        run: python r1c/run_r1c.py annotate --out "$R1C_OUT" --legs D,E,P || true

      - name: Annotations - F and G (Exchange)
        if: always()
        run: python r1c/run_r1c.py annotate --out "$R1C_OUT" --legs F,G || true

      - name: Annotations - mutation verdicts
        if: always()
        run: python r1c/run_r1c.py annotate --out "$R1C_OUT" --legs MUT || true

      - name: Upload artifacts (junit, logs, tuple, identity, env, mutation outputs, verdict CSVs, SHA-256)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-r1c-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1c-out
          retention-days: 90
          if-no-files-found: error

      - name: Gate - fail on any FAIL, BLOCKED or surviving mutant
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          p = os.path.join(os.environ['R1C_OUT'], 'status.json')
          try:
              s = json.load(open(p))
          except (OSError, ValueError) as e:
              print('::error::status.json missing or unreadable (BLOCKED): ' + repr(e)); sys.exit(1)
          print(json.dumps(s, indent=1))
          if not s.get('ok'):
              print('::error::R1C targeted qualification not clean: FAIL/BLOCKED verdict, problem, or surviving mutant'); sys.exit(1)
          PY
