name: Capture qualification run metadata
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Inventoried public source repository
        type: choice
        required: true
        options:
          - cogno-us/cognous-open-control-stack
          - cogno-us/cognous-execution-runtime
          - cogno-us/cognous-replay-bundle
          - cogno-us/cognous-governance-evidence-pack
          - cogno-us/cognous-governed-exchange
          - cogno-us/open-decision-evidence-standard
          - cogno-us/cognous-evidence-registry
          - cogno-us/cognous-stack-qualification
      run_id:
        description: Numeric GitHub Actions run ID
        type: string
        required: true
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: qualification-evidence-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPOSITORY: ${{ inputs.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Credentials persist because the final step pushes the evidence branch with the checkout token.
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Capture public metadata without executing source or downloading raw logs
        run: python tools/capture_workflow_run.py --repository "$SOURCE_REPOSITORY" --run-id "$SOURCE_RUN_ID"
      - name: Regenerate and validate the dashboard
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements-ci.lock
          python tools/build_dashboard.py --write-markdown
          python -m unittest discover -s tests -v
          python tools/validate_catalog.py
          python tools/validate_migrations.py
          git diff --check
      - name: Retain validated capture and rendered dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: captured-qualification-run-${{ github.run_id }}
          path: |
            results/workflows/
            docs/qualification-dashboard.md
            _site/
          retention-days: 14
          if-no-files-found: error
      - name: Open results review PR
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="evidence/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git add -- results/workflows docs/qualification-dashboard.md
          while IFS= read -r path; do
            case "$path" in
              results/workflows/*|docs/qualification-dashboard.md) ;;
              *) echo "Unexpected generated path; refusing publication: $path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          if git diff --cached --quiet; then
            echo 'Snapshot already recorded; nothing to publish.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record qualification workflow metadata and dashboard'
          git push origin HEAD:"$branch"
          cat > "$RUNNER_TEMP/capture-body.md" <<'BODY'
          Record public GitHub-reported execution metadata with exact source/suite identities, artifact expiry and explicit limitations. The dashboard was regenerated, and mapping, provenance, catalog and regression checks ran before this PR was created.

          This PR does not execute the source, download raw logs, accept catalog scenarios, select component revisions or authorize release/production. The committed snapshot is durable metadata; referenced logs and artifact bytes may expire. A PR made with GITHUB_TOKEN may not trigger additional checks; the capture workflow runs its checks before creating it.
          BODY
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title 'Record qualification run metadata' --body-file "$RUNNER_TEMP/capture-body.md"
