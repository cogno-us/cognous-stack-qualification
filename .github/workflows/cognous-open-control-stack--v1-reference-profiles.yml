name: cognous-open-control-stack / V1 reference extensions
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: v1-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: Linux / ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
        - profile: environment
          tests: tests/test_reference_environment.py
        - profile: governed-context
          tests: tests/test_context_memory_profile.py
        - profile: institutional-review
          tests: tests/test_institutional_review_profile.py
        - profile: temporal-refund
          tests: tests/test_temporal_refund_profile.py
        - profile: context-action
          tests: tests/test_context_action_profile.py
        - profile: notification
          tests: tests/test_notification_profile.py
        - profile: recovery
          tests: tests/test_sqlite_recovery_profile.py
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROFILE: ${{ matrix.profile }}
      TEST_FILE: ${{ matrix.tests }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        repository: cogno-us/cognous-open-control-stack
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/profile.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - run: python -m pip install 'pytest>=8,<10' 'pydantic>=2,<3'
    - name: Run prerequisites and reference profile
      shell: bash
      run: "mkdir -p results\npython tools/reference_environment.py --profile ordinary-bounded --storage-dir results\
        \ > results/environment.json\ncase \"$PROFILE\" in\n  environment|recovery) ;;\n  context-action|notification)\n\
        \    python tools/bound_context_notification.py --profile \"$PROFILE\" --results-dir \"results/$PROFILE\"\
        \ ;;\n  *)\n    python tools/v1_reference_profiles.py --profile \"$PROFILE\" --results-dir \"results/$PROFILE\"\
        \ ;;\nesac\n"
    - name: Run bounded tests
      run: timeout 120s python -m pytest -q "$TEST_FILE" --junitxml=results/tests.xml
    - name: Bind batch evidence
      if: always()
      run: python tools/v1_release_evidence.py record --batch "$PROFILE" --results-dir results
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: v1-${{ matrix.profile }}
        path: results/
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-profile-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
  aggregate:
    name: V1 complete evidence gate
    needs: profile
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    env:
      PROFILE_STATUS: ${{ needs.profile.result }}
      EXPECTED_REVISION: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_revision || '0e6ab2435438dd1edcdc5a00789afa6f0f5f4ccf' }}
        repository: cogno-us/cognous-open-control-stack
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-open-control-stack --source-root "." --evidence
        "qualification-evidence/aggregate.json"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - run: python -m pip install 'pytest>=8,<10'
    - name: Test gate rejection cases
      run: timeout 60s python -m pytest -q tests/test_v1_release_evidence.py
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: v1-*
        path: results/batches
    - name: Require complete same-revision evidence
      run: python tools/v1_release_evidence.py aggregate --results-dir results/batches --revision "$EXPECTED_REVISION"
        --jobs-status "$PROFILE_STATUS" > results/v1-extension-summary.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: v1-extension-release-evidence
        path: results/v1-extension-summary.json
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-open-control-stack-aggregate-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
