name: Repaired-source runtime qualification
on:
  pull_request:
    paths:
      - process/security-runtime-candidate-20261016.json
      - suites/security-runtime/**
      - tools/run_security_runtime.py
      - .github/workflows/security-runtime-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: cbea38e153806d244e5f4284d76485a89c6a2716
          path: _hub
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r _hub/tools/requirements-release.lock
      - run: python tools/run_security_runtime.py --prepare-work --components _components --out results/security-runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repaired-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/security-runtime/
          if-no-files-found: error
