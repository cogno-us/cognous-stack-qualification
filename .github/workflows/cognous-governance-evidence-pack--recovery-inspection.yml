name: cognous-governance-evidence-pack / Recovery inspection evidence
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: evidence
        repository: cogno-us/cognous-governance-evidence-pack
        ref: ${{ inputs.source_revision || '1e789c7d67a897097445faef1813fb0cd22d55e5' }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-replay-bundle
        ref: 696e7bc2432fc7b5cf2d6e6c5f0b944b2d9a265f
        path: replay
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: 8e7d634cf0a22b6f3c1fc6d93afe92c7414fa243
        path: runtime
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-governance-evidence-pack --source-root
        "evidence" --evidence ".qualification-evidence/inspect.json"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify exact dependencies
      run: 'test "$(git -C replay rev-parse HEAD)" = "696e7bc2432fc7b5cf2d6e6c5f0b944b2d9a265f"

        test "$(git -C runtime rev-parse HEAD)" = "8e7d634cf0a22b6f3c1fc6d93afe92c7414fa243"

        '
    - name: Install native packages
      run: python -m pip install -e replay -e 'evidence[dev]'
    - name: Qualify native recovery evidence mapping
      working-directory: evidence
      env:
        COGNOUS_REPLAY_SOURCE: ${{ github.workspace }}/replay
        COGNOUS_RUNTIME_SOURCE: ${{ github.workspace }}/runtime
      run: python -m pytest -q tests/recovery_inspection_checks.py
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-governance-evidence-pack-inspect-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: .qualification-evidence/
        if-no-files-found: error
