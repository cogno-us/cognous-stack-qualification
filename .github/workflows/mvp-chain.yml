name: MVP chain (proposed)
# Exact-candidate MVP chain harness (suites/mvp-chain): one governed $10 synthetic refund through the Control Plane, operation identity,
# real claim provisioning, route B atomic executor, Replay, Evidence Pack and the pinned Verifier, plus the six negative controls.
# Dispatch only: it never runs on push, selects nothing, declares no acceptance and changes no verdict. Statuses are computed from
# process/mvp-chain/expectations.proposed.v2.json, which Qualification owns. A mismatched or dirty checkout fails the job; nothing skips.
'on':
  workflow_dispatch:
    inputs:
      control_plane_revision:
        description: cogno-us/cognous-control-plane commit under test (0a41faa972699f7ec3063967a14cd9bdd3e67d27 is the unpatched pin)
        required: true
        type: string
      runtime_revision:
        description: cogno-us/cognous-execution-runtime commit (default is the proposed pin)
        required: false
        default: ec728da6dc301a664b331ac8986afd6e850a1273
        type: string
      replay_revision:
        description: cogno-us/cognous-replay-bundle commit (default is the proposed pin)
        required: false
        default: 028f63d1c001f99580583888fa4b4e46d77a267b
        type: string
      evidence_pack_revision:
        description: cogno-us/cognous-governance-evidence-pack commit (default is the proposed pin)
        required: false
        default: a3ebbb90559a44a88855139a182649d3792bb1ca
        type: string
      odes_revision:
        description: cogno-us/open-decision-evidence-standard commit (default is the proposed pin)
        required: false
        default: e86a25a1d660e74533337d38744e2934200a50ae
        type: string
      verifier_revision:
        description: cogno-us/cognous-open-control-stack-verifier commit (default is the proposed pin)
        required: false
        default: c0b8ba1f55b75db787a320f3de0f79342c6f6826
        type: string
      manifest_revision:
        description: cogno-us/cognous-action-manifest commit (default is the proposed pin)
        required: false
        default: fa170815ef96a54c233d0dd9da821b60debabf8b
        type: string
      qualification_revision:
        description: Suite commit (blank uses the workflow event commit)
        required: false
        type: string
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate revision inputs (40-hex commit SHAs only)
        env:
          REVS: ${{ inputs.control_plane_revision }} ${{ inputs.runtime_revision }} ${{ inputs.replay_revision }} ${{ inputs.evidence_pack_revision }} ${{ inputs.odes_revision }} ${{ inputs.verifier_revision }} ${{ inputs.manifest_revision }}
          QUAL_REV: ${{ inputs.qualification_revision }}
        run: |
          for v in $REVS; do [[ "$v" =~ ^[0-9a-f]{40}$ ]] || { echo "revision input is not a 40-hex commit SHA"; exit 1; }; done
          [[ -z "$QUAL_REV" || "$QUAL_REV" =~ ^[0-9a-f]{40}$ ]] || { echo "qualification_revision is not a 40-hex commit SHA"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.qualification_revision || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-control-plane
          ref: ${{ inputs.control_plane_revision }}
          path: components/control_plane
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: ${{ inputs.runtime_revision }}
          path: components/runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: ${{ inputs.replay_revision }}
          path: components/replay
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-governance-evidence-pack
          ref: ${{ inputs.evidence_pack_revision }}
          path: components/evidence_pack
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/open-decision-evidence-standard
          ref: ${{ inputs.odes_revision }}
          path: components/odes
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack-verifier
          ref: ${{ inputs.verifier_revision }}
          path: components/verifier
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-action-manifest
          ref: ${{ inputs.manifest_revision }}
          path: components/manifest
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r .github/locks/cryptography-pydantic-pytest-a9a750.txt
      - name: Verify the checked-out revisions
        env:
          CP_REV: ${{ inputs.control_plane_revision }}
          RT_REV: ${{ inputs.runtime_revision }}
          RP_REV: ${{ inputs.replay_revision }}
          EP_REV: ${{ inputs.evidence_pack_revision }}
          OD_REV: ${{ inputs.odes_revision }}
          VF_REV: ${{ inputs.verifier_revision }}
          AM_REV: ${{ inputs.manifest_revision }}
        run: |
          test "$(git -C components/control_plane rev-parse HEAD)" = "$CP_REV"
          test "$(git -C components/runtime rev-parse HEAD)" = "$RT_REV"
          test "$(git -C components/replay rev-parse HEAD)" = "$RP_REV"
          test "$(git -C components/evidence_pack rev-parse HEAD)" = "$EP_REV"
          test "$(git -C components/odes rev-parse HEAD)" = "$OD_REV"
          test "$(git -C components/verifier rev-parse HEAD)" = "$VF_REV"
          test "$(git -C components/manifest rev-parse HEAD)" = "$AM_REV"
      - name: Run the mvp-chain suite (failures are reported, never suppressed)
        env:
          MVP_CP_DIR: ${{ github.workspace }}/components/control_plane
          MVP_RUNTIME_DIR: ${{ github.workspace }}/components/runtime
          MVP_REPLAY_DIR: ${{ github.workspace }}/components/replay
          MVP_PACK_DIR: ${{ github.workspace }}/components/evidence_pack
          MVP_ODES_DIR: ${{ github.workspace }}/components/odes
          MVP_VERIFIER_DIR: ${{ github.workspace }}/components/verifier
          MVP_MANIFEST_DIR: ${{ github.workspace }}/components/manifest
          MVP_CP_REVISION: ${{ inputs.control_plane_revision }}
          MVP_RESULTS_DIR: ${{ github.workspace }}/results/mvp-chain
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider suites/mvp-chain --junitxml=results/mvp-chain/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mvp-chain-${{ github.sha }}
          path: results/mvp-chain
