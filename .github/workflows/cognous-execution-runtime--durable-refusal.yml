name: cognous-execution-runtime / Durable refusal capture
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  refusal:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_revision || '309e194c1b0a3de23e11e20133e6eaf88875e48a' }}
        repository: cogno-us/cognous-execution-runtime
        persist-credentials: false
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-execution-runtime --source-root "." --evidence
        "qualification-evidence/refusal.json"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: cogno-us/cognous-control-plane
        ref: c7f122ba3a6e39f9268a7163c99be3ee514cd97e
        path: pinned/refusal-control-plane
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: cogno-us/cognous-action-manifest
        ref: 46c950bed37fe3812000895430bc0312d29e37ce
        path: pinned/refusal-manifest
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install pytest==8.3.5 pydantic==2.11.9
    - run: python -m pytest -q tests/test_refusal_capture.py
      env:
        PYTHONPATH: .:pinned/refusal-control-plane/src
        PYTHONDONTWRITEBYTECODE: '1'
        MOLTBOT_SAFE_CONTROL_PLANE_ROOT: pinned/refusal-control-plane
        MOLTBOT_SAFE_MANIFEST_FIXTURE: pinned/refusal-manifest/examples/refund_integration_v1_1.manifest.json
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-execution-runtime-refusal-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: qualification-evidence/
        if-no-files-found: error
