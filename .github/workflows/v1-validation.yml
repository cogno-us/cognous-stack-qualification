name: V1 validation controller
# Controller for the frozen-V1 validation. It never changes product code, component
# pins, profiles or defaults. Component code runs only in read-only, secret-free jobs;
# the single write-capable job runs trusted harness code and treats artifacts as data.
on:
  workflow_dispatch:
    inputs:
      validation_id:
        description: Validation ID (must match process/v1-validation/<id>/freeze-manifest.json)
        required: true
        default: v1-2026-10-16-a
        type: string
      label:
        description: Short label for this run (appears in the results branch)
        required: false
        default: baseline
        type: string
      retain_native:
        description: Retain the full native per-case evidence tree in Git (large; use for the authoritative run)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: v1-validation-${{ inputs.validation_id }}-${{ inputs.label }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  MANIFEST: process/v1-validation/${{ inputs.validation_id }}/freeze-manifest.json
  REFREEZE_LOG: process/v1-validation/${{ inputs.validation_id }}/refreeze-log.json
  V1_PROFILE: process/security-runtime-f5b-20261016-r8.json
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Validate workflow inputs (fails closed before any other step)
        env:
          VID: ${{ inputs.validation_id }}
          LABEL: ${{ inputs.label }}
        run: |
          [[ "$VID" =~ ^v1-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+$ ]] || { echo "validation_id does not match the allowed pattern"; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || { echo "label does not match the allowed pattern"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: plan
        run: python tools/v1_validation.py plan --manifest "$MANIFEST" --refreeze-log "$REFREEZE_LOG" --linux-only --github-output "$GITHUB_OUTPUT" --out-file out/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1v-plan
          path: out
          if-no-files-found: error

  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate workflow inputs (fails closed before any other step)
        env:
          VID: ${{ inputs.validation_id }}
          LABEL: ${{ inputs.label }}
        run: |
          [[ "$VID" =~ ^v1-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+$ ]] || { echo "validation_id does not match the allowed pattern"; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || { echo "label does not match the allowed pattern"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 8517818fbf817897aacfb6fe7898c22aea46fd95
          path: hub
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify every frozen identity (fails closed)
        run: python q/tools/v1_validation.py freeze-verify --manifest "q/$MANIFEST" --refreeze-log "q/$REFREEZE_LOG" --qual-profile "$V1_PROFILE" --hub-dir hub --qual-dir q --work "$RUNNER_TEMP/pins" --out out/freeze/freeze-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1v-freeze
          path: out/freeze
          if-no-files-found: error

  components:
    needs: [plan, freeze]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          sparse-checkout: |
            tools
            suites/_pins.py
            process/v1-validation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: ''
      - name: Fetch the exact pinned commit, then discover and run the component's own tests
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          REPOSITORY: ${{ matrix.repository }}
          PIN_SHA: ${{ matrix.sha }}
          RUNNER_OS_NAME: ${{ matrix.os }}
          SUITE_TIMEOUT: ${{ matrix.timeout }}
        run: python q/tools/v1_validation.py component-suite --fetch --component "$COMPONENT" --repository "$REPOSITORY" --sha "$PIN_SHA" --repo-dir c --out out --os-name "$RUNNER_OS_NAME" --timeout "$SUITE_TIMEOUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1v-comp-${{ matrix.component }}-${{ matrix.os }}-py${{ matrix.python }}
          path: out
          if-no-files-found: warn

  native-f5b:
    needs: [freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 8517818fbf817897aacfb6fe7898c22aea46fd95
          path: _hub
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r _hub/tools/requirements-release.lock
          python -m pip install pytest
          rm -rf _hub
      - name: Repeat exact F5b merged-source cases twice with fresh stores
        working-directory: q
        run: |
          python tools/run_security_runtime.py --profile "$V1_PROFILE" --prepare-work --components "$RUNNER_TEMP/_components" --out "$RUNNER_TEMP/native/run-1"
          python tools/run_security_runtime.py --profile "$V1_PROFILE" --components "$RUNNER_TEMP/_components" --out "$RUNNER_TEMP/native/run-2"
      - name: Re-verify both repetitions and audit native rows
        working-directory: q
        run: |
          python -I tools/summarize_security_runtime.py "$RUNNER_TEMP/native/run-1"
          python -I tools/summarize_security_runtime.py "$RUNNER_TEMP/native/run-2"
      - name: Collect result record
        if: always()
        run: |
          mkdir -p out
          cp -r "$RUNNER_TEMP/native" out/native
          python - <<'EOF'
          import json,glob,os,xml.etree.ElementTree as ET
          rows={}
          for run in ('run-1','run-2'):
              files=glob.glob(f'out/native/{run}/**/junit.xml',recursive=True)
              c=dict(testcases=0,failures=0,errors=0,skipped=0)
              for f in files:
                  for tc in ET.parse(f).getroot().iter('testcase'):
                      c['testcases']+=1
                      c['failures']+=tc.find('failure') is not None
                      c['errors']+=tc.find('error') is not None
                      c['skipped']+=tc.find('skipped') is not None
              rows[run]=c
          ok=all(c['testcases']>0 and c['failures']==c['errors']==c['skipped']==0 for c in rows.values())
          json.dump({'schema':'cognous.v1-validation-job/1','component':'native-f5b-suite','status':'PASS' if ok else 'FAIL','repetitions':rows,
                     'workflow_run':os.environ['GITHUB_RUN_ID'],'attempts':[{'outcome':'PASS' if ok else 'FAIL','counts':rows['run-1']}],'os':'ubuntu-latest','python':'3.12'},
                    open('out/result.json','w'),indent=2)
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1v-native-f5b
          path: out
          if-no-files-found: error

  harness-and-hub-tests:
    needs: [freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 8517818fbf817897aacfb6fe7898c22aea46fd95
          path: hub
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualification tooling tests
        working-directory: q
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements-ci.lock
          python -m pip install pytest
          mkdir -p ../out/qual-tooling
          echo 'tests/native excluded: needs NATIVE_HUB_ROOT (native hub checkout) supplied only by the serial workflow; covered separately' > ../out/qual-tooling/scope-note.txt
          python -m pytest -q -p no:cacheprovider --ignore=tests/native --junitxml=../out/qual-tooling/junit.xml tests || echo "pytest exit $?" > ../out/qual-tooling/exit.txt
      - name: Hub-side tests at the frozen hub head
        working-directory: hub
        run: |
          python -m pip install --require-hashes -r tools/requirements-release.lock
          mkdir -p ../out/hub-tests
          timeout 900 python -m pytest -q -p no:cacheprovider --junitxml=../out/hub-tests/junit.xml tests || echo "pytest exit $?" > ../out/hub-tests/exit.txt
      - name: Result records
        if: always()
        run: |
          python - <<'EOF'
          import json,os,xml.etree.ElementTree as ET
          for name in ('qual-tooling','hub-tests'):
              d=f'out/{name}'; f=d+'/junit.xml'
              c=dict(testcases=0,failures=0,errors=0,skipped=0)
              if os.path.exists(f):
                  for tc in ET.parse(f).getroot().iter('testcase'):
                      c['testcases']+=1; c['failures']+=tc.find('failure') is not None
                      c['errors']+=tc.find('error') is not None; c['skipped']+=tc.find('skipped') is not None
              ok=c['testcases']>0 and c['failures']==c['errors']==0
              st='PASS' if ok else ('FAIL' if c['testcases'] else 'INCONCLUSIVE')
              json.dump({'schema':'cognous.v1-validation-job/1','component':name,'status':st,'workflow_run':os.environ['GITHUB_RUN_ID'],
                         'attempts':[{'outcome':st,'counts':c}],'os':'ubuntu-latest','python':'3.12'},open(d+'/result.json','w'),indent=2)
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1v-harness-hub
          path: out
          if-no-files-found: error

  probes:
    needs: [freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: probes-index, repo: cogno-us/cognous-evidence-registry, sha: d17b8ac2b8445d385fbf51185a35914b2d8b835c, env: PROBE_INDEX_DIR, extra: '--npm-dir chain'}
          - {name: probes-bitrep, repo: cogno-us/cognous-evidence-attestation, sha: 5b5077dafde232a7801cb425c4efddcffb468723, env: PROBE_BITREP_DIR, extra: ''}
          - {name: probes-moltbot-safe, repo: cogno-us/cognous-execution-runtime, sha: 11de097c450d3ad4d89f9add41b00e38e7cc2c7c, env: PROBE_RUNTIME_DIR, extra: ''}
          - {name: probes-replay-bundle, repo: cogno-us/cognous-replay-bundle, sha: 46e8bd7c263f5075cac3a7a9defcb265384f40e9, env: PROBE_REPLAY_DIR, extra: ''}
          - {name: probes-evidence-pack, repo: cogno-us/cognous-governance-evidence-pack, sha: 4fbbd34418f8dce7a536879d7bd0378737179f47, env: PROBE_EVIDENCE_PACK_DIR, extra: ''}
          - {name: probes-odes, repo: cogno-us/open-decision-evidence-standard, sha: cdf704c88bb6542e3f1121a5ceb6cb03fc7d6a52, env: PROBE_ODES_DIR, extra: ''}
          - {name: probes-control-plane, repo: cogno-us/cognous-control-plane, sha: 3cd17ead6b24301290ad1e50ae4b22bbd93c12fb, env: PROBE_CONTROL_PLANE_DIR, extra: '--extras runtime-authority'}
          - {name: probes-authority, repo: cogno-us/cognous-institutional-governance, sha: cbc39e79a1328a74b6cb1aba0cd1e5149164865d, env: PROBE_AUTHORITY_DIR, extra: '--full-history --harness-requirements'}
          - {name: probes-action-manifest, repo: cogno-us/cognous-action-manifest, sha: 2c36bcd0b620dbfe7ad924bc7196a3f0c04c5c5e, env: PROBE_ACTION_MANIFEST_DIR, extra: '--full-history'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: ''
      - name: Probes at the exact pin (calibrated controls included for the Index)
        env:
          PROBE_NAME: ${{ matrix.name }}
          PROBE_REPO: ${{ matrix.repo }}
          PROBE_SHA: ${{ matrix.sha }}
          PROBE_ENV: ${{ matrix.env }}
          PROBE_EXTRA: ${{ matrix.extra }}
        run: |
          # PROBE_EXTRA holds fixed, reviewed flags from the matrix literal above; word-splitting is intended.
          # shellcheck disable=SC2086
          python q/tools/v1_validation.py probe-suite --component "$PROBE_NAME" --repository "$PROBE_REPO" --sha "$PROBE_SHA" --repo-dir "$RUNNER_TEMP/pin" --out out --os-name ubuntu-latest --suite q/suites/v1-probes --env-var "$PROBE_ENV" $PROBE_EXTRA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1v-${{ matrix.name }}
          path: out
          if-no-files-found: error

  provenance-scan:
    needs: [freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate workflow inputs (fails closed before any other step)
        env:
          VID: ${{ inputs.validation_id }}
          LABEL: ${{ inputs.label }}
        run: |
          [[ "$VID" =~ ^v1-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+$ ]] || { echo "validation_id does not match the allowed pattern"; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || { echo "label does not match the allowed pattern"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: ''
      - name: SR-3 provenance scan of every pinned public source (hub, qualification closeout and all lock/subject components)
        run: |
          python q/tools/v1_validation.py probe-suite --component provenance-scan --pins-manifest "q/$MANIFEST" --refreeze-log "q/$REFREEZE_LOG" --repo-dir "$RUNNER_TEMP/pins" --out out --os-name ubuntu-latest --suite q/suites/v1-probes --env-var PROBE_PINS_DIR
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1v-provenance-scan
          path: out
          if-no-files-found: error

  scenarios:
    needs: [freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 8517818fbf817897aacfb6fe7898c22aea46fd95
          path: _hub
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r _hub/tools/requirements-release.lock
          python -m pip install pytest
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-evidence-registry
          ref: d17b8ac2b8445d385fbf51185a35914b2d8b835c
          path: _index
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-evidence-attestation
          ref: 5b5077dafde232a7801cb425c4efddcffb468723
          path: _bitrep
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Index and BitRep pins for C03/C04 (no dependency files are written into the pins)
        run: |
          python -m pip install -r _index/requirements.txt -r _bitrep/requirements.txt httpx pydantic-settings
          cp -r _index/chain "$RUNNER_TEMP/index-chain"
          (cd "$RUNNER_TEMP/index-chain" && npm ci --ignore-scripts)
      - name: Build the seven pinned components (pristine, via the native runner's prepare step)
        working-directory: q
        run: python tools/run_security_runtime.py --profile "$V1_PROFILE" --prepare-work --components "$RUNNER_TEMP/_components" --out "$RUNNER_TEMP/prep" || true
      - name: Catalog scenarios (each case executes twice and compares)
        working-directory: q
        run: |
          mkdir -p ../out/evidence
          PYTHONDONTWRITEBYTECODE=1 SCN_COMPONENTS_DIR="$RUNNER_TEMP/_components" SCN_HUB_DIR="$GITHUB_WORKSPACE/_hub" SCN_EVIDENCE_DIR="$GITHUB_WORKSPACE/out/evidence" SCN_INDEX_DIR="$GITHUB_WORKSPACE/_index" SCN_BITREP_DIR="$GITHUB_WORKSPACE/_bitrep" SCN_INDEX_CHAIN_DIR="$RUNNER_TEMP/index-chain" timeout 4800 python -m pytest -q -p no:cacheprovider suites/v1-scenarios --junitxml="$GITHUB_WORKSPACE/out/junit.xml" || echo "pytest exit $?" > ../out/exit.txt
      - name: Result record
        if: always()
        run: |
          mkdir -p out
          python - <<'EOF'
          import json,os,xml.etree.ElementTree as ET
          c=dict(testcases=0,failures=0,errors=0,skipped=0)
          try:
              for tc in ET.parse('out/junit.xml').getroot().iter('testcase'):
                  c['testcases']+=1; c['failures']+=tc.find('failure') is not None; c['errors']+=tc.find('error') is not None; c['skipped']+=tc.find('skipped') is not None
          except Exception as e: c['parse_error']=str(e)
          st='PASS' if c['testcases'] and not (c['failures'] or c['errors']) else 'FAIL' if c['testcases'] else 'INCONCLUSIVE'
          json.dump({'schema':'cognous.v1-validation-job/1','component':'scenarios','kind':'scenario-suite','status':st,'counts':c,'os':'ubuntu-latest','python':'3.12','workflow_run':os.environ.get('GITHUB_RUN_ID')},open('out/result.json','w'),indent=2)
          EOF
      - name: Make evidence file names portable (colons etc. are invalid in artifacts and Windows checkouts); keep a name map
        if: always()
        run: |
          python - <<'EOF'
          import os,re,json
          root='out/evidence'; m={}
          if os.path.isdir(root):
              for d,_,fs in os.walk(root):
                  for f in fs:
                      n=re.sub(r'[<>:"|?*\\\\]','_',f)
                      if n!=f:
                          if os.path.exists(os.path.join(d,n)): n=n[:-5]+'__'+str(len(m))+'.json'
                          os.rename(os.path.join(d,f),os.path.join(d,n)); m[os.path.relpath(os.path.join(d,n),root)]=f
              json.dump(m,open('out/evidence-name-map.json','w'),indent=1)
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1v-scenarios
          path: out
          if-no-files-found: error

  matched-refund:
    needs: [freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 11de097c450d3ad4d89f9add41b00e38e7cc2c7c
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-control-plane
          ref: 3cd17ead6b24301290ad1e50ae4b22bbd93c12fb
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cogno-us/cognous-open-control-stack
          ref: 8517818fbf817897aacfb6fe7898c22aea46fd95
          path: _hub
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: ''
      - run: |
          python -m pip install --require-hashes -r _hub/tools/requirements-release.lock
          rm -rf _hub
      - name: Re-execute the matched refund battery (20 trials) from pinned sources
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p out
          python - <<'PY'
          import json,os
          # The supplied external fixture is not republished; rebuild the runner's input shape from the retained common stimulus (values the runner asserts exactly).
          c=json.load(open('q/results/comparisons/matched-refund-20261016/fixture.json'))['common_stimulus']
          json.dump({'initial_state':{'account':c['account']},'params':c['params'],'simulation_clock':c['simulation_clock']},open(os.path.join(os.environ['RUNNER_TEMP'],'fixture.json'),'w'))
          PY
          python q/tools/run_matched_refund.py --runtime runtime --control control --fixture "$RUNNER_TEMP/fixture.json" --output "$RUNNER_TEMP/matched" 2>&1 | tee out/run.log
      - name: Compare with the retained PR 29 reference result
        if: always()
        run: |
          python - <<'EOF'
          import json,os,xml.etree.ElementTree as ET
          ref=json.load(open('q/results/comparisons/matched-refund-20261016/summary.json'))
          new_path=os.path.join(os.environ['RUNNER_TEMP'],'matched','summary.json')
          res={'schema':'cognous.v1-validation-job/1','component':'matched-refund-rerun','os':'ubuntu-latest','python':'3.12','workflow_run':os.environ['GITHUB_RUN_ID']}
          key=lambda c:(c['scenario_id'],c['variant'],c['repetition'])
          if os.path.exists(new_path):
              new=json.load(open(new_path)); a={key(c):(c['verdict'],c['balance_cents'],c['state_version'],c['effect_count'],c['observation_verdict']) for c in new['cases']}
              b={key(c):(c['verdict'],c['balance_cents'],c['state_version'],c['effect_count'],c['observation_verdict']) for c in ref['cases']}
              same=a==b and new['counts']=={'PASS':20} and len(a)==20
              res.update(status='PASS' if same else 'FAIL',reference_trials=len(b),new_trials=len(a),new_counts=new['counts'],identical_to_reference=a==b,
                         sources=new['sources'],reason=None if same else 'new execution differs from retained reference')
              os.makedirs('out',exist_ok=True)
              for f in ('summary.json','test-results.xml','comparison.json'):
                  src=os.path.join(os.environ['RUNNER_TEMP'],'matched',f)
                  if os.path.exists(src): open('out/'+f,'wb').write(open(src,'rb').read())
          else:
              res.update(status='INCONCLUSIVE',reason='matched refund runner produced no summary (see run.log)')
          res['attempts']=[{'outcome':res['status'],'counts':{'testcases':res.get('new_trials',0),'failures':0 if res['status']=='PASS' else 1,'errors':0,'skipped':0}}]
          json.dump(res,open('out/result.json','w'),indent=2)
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1v-matched-refund
          path: out
          if-no-files-found: error

  results:
    needs: [plan, freeze, components, native-f5b, harness-and-hub-tests, probes, provenance-scan, scenarios, matched-refund]
    # Runs after failed coverage jobs (the aggregate must record them) but never after failed input validation or a cancelled run.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate workflow inputs (fails closed before any other step)
        env:
          VID: ${{ inputs.validation_id }}
          LABEL: ${{ inputs.label }}
        run: |
          [[ "$VID" =~ ^v1-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+$ ]] || { echo "validation_id does not match the allowed pattern"; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || { echo "label does not match the allowed pattern"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: q
          persist-credentials: true  # needed only by the push step below
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v1v-*
          path: collected
      - name: Aggregate (refuses to promote missing, failed or skipped mandatory coverage)
        env:
          VID: ${{ inputs.validation_id }}
        run: |
          python q/tools/v1_validation.py aggregate --inputs collected --out agg --validation-id "$VID" --requirements "q/process/v1-validation/$VID/requirements.json"
      - name: Retain results in the repository through a reviewable PR
        env:
          GH_TOKEN: ${{ github.token }}
          VID: ${{ inputs.validation_id }}
          LABEL: ${{ inputs.label }}
          RETAIN_NATIVE: ${{ inputs.retain_native }}
        run: |
          set -euo pipefail
          cd q
          dest="results/v1-validation/${VID}/${LABEL}-${GITHUB_RUN_ID}"
          branch="validation-results/${VID}/${LABEL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "v1-validation-controller"
          git config user.email "v1-validation-controller@users.noreply.github.com"
          git checkout -b "$branch"
          mkdir -p "$dest/jobs"
          for d in ../collected/*; do n="$(basename "$d")"; n="${n#v1v-}"; [ "$n" = "native-f5b" ] && n="native"; cp -r "$d" "$dest/jobs/$n"; done
          # Zero-byte transient .lock files have names that break Windows checkouts; omit them but list each with size and sha256.
          if [ "$RETAIN_NATIVE" = "true" ]; then python3 tools/omit_locks.py "$dest"; else python3 tools/omit_locks.py "$dest" --slim-native; fi
          cp ../agg/summary.json ../agg/summary.md ../agg/requirements-matrix.json ../agg/requirements-matrix.md "$dest/"
          printf '{"workflow_run":"%s","attempt":"%s","harness_revision":"%s","run_url":"%s/%s/actions/runs/%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$dest/run-identity.json"
          find "$dest" -type f -size +50M -print | sed 's/^/OVERSIZE: /' || true
          git add "$dest"
          git commit -q -m "Retain V1 validation results for ${VID} (${LABEL}) from run ${GITHUB_RUN_ID}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "V1 validation results: ${VID} ${LABEL} (run ${GITHUB_RUN_ID})" --body "Retained results of Actions run ${GITHUB_RUN_ID}. Machine-readable summary: ${dest}/summary.json. Not a release decision." || echo "PR creation not permitted by repository settings; branch $branch pushed"
