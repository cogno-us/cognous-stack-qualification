name: cognous-execution-runtime / OpenAPPA synthetic authority conjunction
'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Owning source commit (blank uses recorded baseline)
        required: false
        type: string
      qualification_revision:
        description: Suite commit (blank uses workflow event commit)
        required: false
        type: string
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      qualification_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  conjunction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-execution-runtime
        ref: ${{ inputs.source_revision || '309e194c1b0a3de23e11e20133e6eaf88875e48a' }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: archestra-ai/OpenAPPA
        ref: 10aa0e09e32d8c6704bdb030dc3c66140bf81915
        path: pinned/openappa
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-control-plane
        ref: 2ea9528eeb87e14ff10f05de06473122b9df540f
        path: pinned/control-plane
    - uses: actions/checkout@v4
      with:
        repository: cogno-us/cognous-action-manifest
        ref: 46c950bed37fe3812000895430bc0312d29e37ce
        path: pinned/action-manifest
    - name: Checkout canonical qualification suite
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: ${{ inputs.qualification_revision || github.sha }}
        path: _qualification
        persist-credentials: false
    - name: Retain both source identities and assemble test overlay
      shell: bash
      run: python3 _qualification/tools/install_suite.py --suite cognous-execution-runtime --source-root "." --evidence
        ".qualification-evidence/conjunction.json"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify actual source revisions
      run: 'test "$(git -C pinned/openappa rev-parse HEAD)" = 10aa0e09e32d8c6704bdb030dc3c66140bf81915

        test "$(git -C pinned/control-plane rev-parse HEAD)" = 2ea9528eeb87e14ff10f05de06473122b9df540f

        test "$(git -C pinned/action-manifest rev-parse HEAD)" = 46c950bed37fe3812000895430bc0312d29e37ce

        '
    - name: Compile real embedded decision probe
      shell: bash
      run: 'set -euo pipefail

        rustup toolchain install stable --profile minimal

        cp tools/openappa/cognous_decision_probe.rs pinned/openappa/appa-runtime/examples/

        cat tools/openappa/cognous_trajectory_contract.rs tools/openappa/cognous_persistent_join_main.rs > pinned/openappa/appa-runtime/examples/cognous_persistent_join.rs

        cat tools/openappa/cognous_trajectory_contract.rs tools/openappa/cognous_reply_admission_main.rs > pinned/openappa/appa-runtime/examples/cognous_reply_admission.rs

        cd pinned/openappa

        cargo +stable build --locked -p appa --no-default-features --example cognous_decision_probe --example cognous_persistent_join
        --example cognous_reply_admission

        '
    - name: Exercise both independent denial paths and SQLite state
      env:
        PYTHONPATH: .:pinned/control-plane/src
        MOLTBOT_SAFE_CONTROL_PLANE_ROOT: pinned/control-plane
        MOLTBOT_SAFE_MANIFEST_FIXTURE: pinned/action-manifest/examples/refund_integration_v1_1.manifest.json
        COGNOUS_OPENAPPA_PERSISTENT_PROBE: pinned/openappa/target/debug/examples/cognous_persistent_join
        COGNOUS_OPENAPPA_REPLY_PROBE: pinned/openappa/target/debug/examples/cognous_reply_admission
        COGNOUS_OPENAPPA_PROBE: pinned/openappa/target/debug/examples/cognous_decision_probe
      run: 'python -m pip install pytest==8.3.5 pydantic==2.11.9

        python -m pytest -q tools/openappa/test_conjunction.py tools/openappa/test_persistent_join.py tools/openappa/test_local_join.py
        tools/openappa/test_feedback.py tools/openappa/test_feedback_journal.py tools/openappa/test_journal_crash.py
        tools/openappa/test_journal_contention.py tools/openappa/test_receipt_inspection.py tools/openappa/test_journal_capacity.py
        tools/openappa/test_journal_status.py tools/openappa/test_local_reply.py tools/openappa/test_journal_snapshot.py
        --junitxml=conjunction.xml

        python - <<''PY''

        import xml.etree.ElementTree as ET

        cases = ET.parse(''conjunction.xml'').getroot().findall(''.//testcase'')

        assert len(cases) == 125, len(cases)

        assert all(not any(c.find(tag) is not None for tag in (''skipped'', ''failure'', ''error'')) for c in cases)

        PY

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openappa-conjunction-results
        path: conjunction.xml
        if-no-files-found: error
    - name: Retain relocation source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: relocation-cognous-execution-runtime-conjunction-${{ strategy.job-index }}-${{ github.run_attempt
          }}
        path: .qualification-evidence/
        if-no-files-found: error
